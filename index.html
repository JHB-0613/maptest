<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>서울 지하철 스마트 실내 네비게이션 & 강남역 3D</title>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- OBJLoader CDN 추가 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

  <style>
    :root {
      --bg-dark: #121418;
      --card-bg: rgba(22, 26, 35, 0.94);
      --accent-cyan: #00e5ff;
      --text-main: #ffffff;
      --text-sub: #8e95a5;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      overflow: hidden;
    }

    .phone-container {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      height: 100dvh;
      max-height: 870px;
      background: var(--bg-dark);
      border-radius: 46px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 0 0 4px #2b303c;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 480px) {
      .phone-container {
        max-height: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    .status-bar {
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      font-size: 14px;
      font-weight: 600;
      z-index: 100;
      pointer-events: none;
    }

    .island {
      width: 110px;
      height: 26px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .view.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      visibility: hidden;
    }

    /* 1. 메인 노선도 화면 */
    #main-view {
      background: #f8f9fb;
      overflow: hidden;
      touch-action: none;
    }

    .metro-canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      cursor: grab;
    }
    .metro-canvas-container:active { cursor: grabbing; }

    #map-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 2000px;
      height: 2000px;
      transform-origin: 0 0;
      will-change: transform;
    }

    #official-metro-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }

    .map-pin {
      position: absolute;
      transform: translate(-50%, -100%);
      z-index: 45;
      display: none;
      opacity: 1 !important;
      pointer-events: none;
      animation: pinDrop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pinDrop {
      0% { transform: translate(-50%, -180%); opacity: 0; }
      100% { transform: translate(-50%, -100%); opacity: 1; }
    }

    .zoom-controls {
      position: absolute;
      right: 18px;
      top: 90px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 60;
    }

    .btn-zoom {
      width: 40px;
      height: 40px;
      background: rgba(22, 26, 35, 0.88);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }

    .station-popup-card {
      position: absolute;
      bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      left: 18px;
      right: 18px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 18px 20px;
      z-index: 50;
      display: none;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(25px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .station-title-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .station-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
    }

    .badge-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      color: #ffffff;
      line-height: 1.4;
      display: inline-block;
    }

    .badge-line-1 { background-color: #0052a4; }
    .badge-line-2 { background-color: #00a84d; }
    .badge-line-3 { background-color: #ef7c1c; }
    .badge-line-4 { background-color: #00a5de; }
    .badge-line-5 { background-color: #996cac; }
    .badge-line-6 { background-color: #cd7c2f; }
    .badge-line-7 { background-color: #747f00; }
    .badge-line-8 { background-color: #e6186c; }
    .badge-line-9 { background-color: #bb8336; }
    .badge-shin { background-color: #d4003b; }
    .badge-suin { background-color: #f5a200; }
    .badge-gyeongui { background-color: #77c4a3; }
    .badge-gyeongchun { background-color: #0c8e72; }
    .badge-airport { background-color: #0090d2; }
    .badge-gyeonggang { background-color: #003da5; }
    .badge-seohae { background-color: #81a914; }
    .badge-sillim { background-color: #6789ca; }
    .badge-ui { background-color: #b7c452; }
    .badge-uijeongbu { background-color: #ff9d00; }
    .badge-ever { background-color: #5bb025; }
    .badge-incheon1 { background-color: #7ca8d5; }
    .badge-incheon2 { background-color: #ed8b00; }
    .badge-gtx { background-color: #9a5f78; }
    .badge-gimpo { background-color: #ad8605; }
    .badge-default { background-color: #555e6d; }

    .btn-close-card {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      flex-shrink: 0;
    }

    .btn-detail {
      width: 100%;
      background: linear-gradient(135deg, #1f78ff, #00d2ff);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 6px 18px rgba(0, 180, 255, 0.35);
    }

    /* 2. 실내 지도 화면 */
    #indoor-view {
      background: #181a20;
      display: flex;
      flex-direction: column;
      z-index: 150;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .indoor-header {
      padding: 50px 20px 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
    }

    .indoor-title-wrap { text-align: center; }
    .indoor-title { font-size: 17px; font-weight: 700; }
    .indoor-sub { font-size: 12px; color: var(--text-sub); }

    .btn-indoor-route {
      background: linear-gradient(135deg, #00d2d3, #00b894);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .indoor-controls {
      position: absolute;
      top: 110px;
      left: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 50;
    }

    .toggle-mode {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 3px;
      display: flex;
      width: 90px;
    }

    .toggle-btn {
      flex: 1;
      padding: 6px 0;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: #2a3346;
      color: #00e5ff;
    }

    .floor-selector {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(25, 28, 36, 0.7);
      backdrop-filter: blur(10px);
      padding: 5px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      max-height: 240px;
      overflow-y: auto;
    }

    .floor-btn {
      width: 44px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      color: #a0a8b9;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .floor-btn.active {
      background: rgba(255, 255, 255, 0.2);
      border-color: #ffffff;
      color: #ffffff;
    }

    /* 2D 캔버스 뷰 */
    #indoor-2d-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      touch-action: none;
    }

    #indoor-svg-wrap {
      width: 360px;
      height: 520px;
      position: relative;
    }

    #indoor-svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* 3D WebGL 캔버스 컨테이너 */
    #three-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: none;
    }

    /* 로딩 알림 스피너 */
    #loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.75);
      color: #00e5ff;
      padding: 12px 20px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      display: none;
      z-index: 60;
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
    }

    /* 실내 핑 마커 */
    .indoor-pin-marker {
      position: absolute;
      transform: translate(-50%, -100%);
      cursor: pointer;
      z-index: 30;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .indoor-pin-marker:hover, .indoor-pin-marker:active {
      transform: translate(-50%, -115%) scale(1.15);
    }

    /* 핑 등록 및 상세 모달 */
    .pin-modal {
      position: absolute;
      bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      left: 18px;
      right: 18px;
      background: #ffffff;
      color: #1e2430;
      border-radius: 24px;
      padding: 18px;
      z-index: 80;
      display: none;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      flex-direction: column;
      gap: 10px;
      animation: slideUp 0.3s ease;
    }

    .pin-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pin-modal-title {
      font-size: 16px;
      font-weight: 800;
    }

    .pin-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      user-select: text;
    }

    .pin-textarea {
      width: 100%;
      height: 60px;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
      resize: none;
      user-select: text;
    }

    .pin-img-preview {
      width: 100%;
      max-height: 120px;
      object-fit: cover;
      border-radius: 12px;
      display: none;
    }

    .pin-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-pin-action {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-pin-save { background: #00b894; color: white; }
    .btn-pin-route { background: #0984e3; color: white; }
    .btn-pin-delete { background: #ff7675; color: white; }

    /* 실내 길안내 상단 카드 */
    .indoor-navigation-card {
      position: absolute;
      top: 96px;
      left: 14px;
      right: 14px;
      background: #ffffff;
      color: #1e2430;
      border-radius: 24px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.35);
      z-index: 70;
      display: none;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      animation: slideDown 0.3s ease;
    }

    .indoor-nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 15px;
    }

    .indoor-route-summary {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .indoor-route-time { font-size: 22px; font-weight: 900; color: #00b894; }
    .indoor-route-dist { font-size: 13px; font-weight: 700; color: #64748b; }

    /* 하단 검색바 */
    .bottom-search-wrapper {
      position: absolute;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 18px;
      right: 18px;
      height: 56px;
      background: rgba(22, 26, 35, 0.92);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      display: flex;
      align-items: center;
      padding: 0 8px 0 16px;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .search-icon {
      color: var(--text-sub);
      font-size: 18px;
      margin-right: 10px;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 15px;
      outline: none;
      user-select: text;
    }
    .search-input::placeholder { color: #636b7c; }

    .clear-search-btn {
      color: var(--text-sub);
      font-size: 16px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: none;
      margin-right: 4px;
    }

    .search-suggestions {
      position: absolute;
      bottom: 70px;
      left: 0;
      right: 0;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      display: none;
      max-height: 220px;
      overflow-y: auto;
      z-index: 110;
    }

    .suggestion-item {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 14px;
    }
    .suggestion-item:hover { background: rgba(255, 255, 255, 0.08); }
    .suggestion-badge { font-size: 10px; padding: 1px 6px; border-radius: 6px; color: white; }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="status-bar">
      <span>9:41</span>
      <div class="island"></div>
      <span style="font-size:12px; color:#aaa;">5G ▮ 100%</span>
    </div>

    <!-- 1. 메인 노선도 화면 -->
    <div id="main-view" class="view">
      <div class="metro-canvas-container" id="metro-container">
        <div id="map-wrapper">
          <img src="metroimg.jpg" id="official-metro-img" alt="서울 지하철 노선도" onerror="this.src='metroimg.svg'">

          <svg id="pin-general" class="map-pin" width="38" height="52" viewBox="0 0 384 512">
            <path fill="#00e5ff" stroke="#ffffff" stroke-width="14" d="M172.268 501.67C26.97 291.031 0 269.413 0 192 0 85.961 86.039 0 192 0s192 85.961 192 192c0 77.413-26.97 99.031-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0z"/>
            <circle cx="192" cy="192" r="75" fill="#ffffff"/>
            <circle cx="192" cy="192" r="45" fill="#00e5ff"/>
          </svg>
        </div>
      </div>

      <div class="zoom-controls">
        <button class="btn-zoom" onclick="zoomManual(0.25)">+</button>
        <button class="btn-zoom" onclick="zoomManual(-0.25)">−</button>
      </div>

      <div class="station-popup-card" id="station-card">
        <div class="card-header">
          <div class="station-title-box">
            <span class="station-title" id="card-station-name">강남역</span>
            <div class="badge-wrap" id="card-station-badges"></div>
          </div>
          <button class="btn-close-card" onclick="event.stopPropagation(); deselectStation();">✕</button>
        </div>

        <button class="btn-detail" onclick="enterIndoorView()">
          <span>실내 지도 자세히 보기</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>

      <div class="bottom-search-wrapper" id="main-search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="main-search-box" class="search-input" placeholder="어떤 역을 찾으시나요?" oninput="onMainSearchInput(this.value)">
        <button class="clear-search-btn" id="main-clear-search" onclick="event.stopPropagation(); clearMainSearch();">✕</button>
        <div class="search-suggestions" id="main-suggestions"></div>
      </div>
    </div>

    <!-- 2. 실내 지도 화면 -->
    <div id="indoor-view" class="view hidden">
      <div class="indoor-header">
        <button class="btn-back" onclick="exitIndoorView()">‹</button>
        <div class="indoor-title-wrap">
          <div class="indoor-title" id="indoor-title-text">지하철 실내 지도</div>
          <div class="indoor-sub">원하는 위치를 클릭하여 핑을 찍어보세요</div>
        </div>
        <button class="btn-indoor-route" onclick="openIndoorNavigation()">길안내</button>
      </div>

      <div class="indoor-controls">
        <div class="toggle-mode">
          <button class="toggle-btn active" id="btn-2d" onclick="setIndoorMode('2D')">2D</button>
          <button class="toggle-btn" id="btn-3d" onclick="setIndoorMode('3D')">3D</button>
        </div>
        <div class="floor-selector" id="floor-list"></div>
      </div>

      <!-- 로딩 인디케이터 -->
      <div id="loading-indicator">3D 모델 로딩 중...</div>

      <!-- 2D 캔버스 -->
      <div id="indoor-2d-canvas">
        <div id="indoor-svg-wrap">
          <svg id="indoor-svg" viewBox="0 0 360 520">
            <g fill="#2e3440" stroke="#1c202a" stroke-width="3">
              <rect x="130" y="40" width="100" height="440" rx="12"/>
              <rect x="40" y="200" width="280" height="120" rx="12"/>
            </g>

            <g id="indoor-fixtures">
              <rect x="145" y="60" width="70" height="30" rx="6" fill="#00a84d"/>
              <text x="180" y="80" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">2호선 탑승게이트</text>

              <rect x="145" y="430" width="70" height="30" rx="6" fill="#d4003b"/>
              <text x="180" y="450" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">신분당선 게이트</text>

              <circle cx="65" cy="260" r="14" fill="#2ed573"/>
              <text x="65" y="264" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">1번</text>

              <circle cx="295" cy="260" r="14" fill="#2ed573"/>
              <text x="295" y="264" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">2번</text>

              <circle cx="180" cy="260" r="16" fill="#0984e3"/>
              <text x="180" y="264" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">개찰구</text>

              <circle cx="180" cy="350" r="14" fill="#ff7675"/>
              <text x="180" y="354" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">화장실</text>

              <circle cx="65" cy="290" r="7" fill="#00e5ff" stroke="#fff" stroke-width="2"/>
              <text x="65" y="312" text-anchor="middle" fill="#00e5ff" font-size="11" font-weight="800">내 위치</text>
            </g>

            <path id="indoor-path-line" d="" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="6,4" stroke-linecap="round" style="display:none;"/>
          </svg>

          <div id="indoor-pins-layer"></div>
        </div>
      </div>

      <!-- 3D WebGL 캔버스 -->
      <div id="three-container"></div>

      <!-- 실내 길안내 패널 -->
      <div class="indoor-navigation-card" id="indoor-nav-card">
        <div class="indoor-nav-header">
          <span>🚶 실내 길안내 경로</span>
          <button style="border:none; background:none; font-size:16px; cursor:pointer;" onclick="closeIndoorNavigation()">✕</button>
        </div>
        <div class="indoor-route-summary">
          <div>
            <div style="font-size:11px; color:#64748b; font-weight:700;">내 위치 ➔ <span id="nav-target-name">목적지</span></div>
            <div class="indoor-route-time" id="nav-time-text">1분 소요</div>
          </div>
          <div class="indoor-route-dist" id="nav-dist-text">약 45m</div>
        </div>
      </div>

      <!-- 핑 등록/조회 모달 -->
      <div class="pin-modal" id="pin-modal">
        <div class="pin-modal-header">
          <span class="pin-modal-title" id="pin-modal-title">새로운 장소 핑 등록</span>
          <button style="border:none; background:none; font-size:16px; cursor:pointer;" onclick="closePinModal()">✕</button>
        </div>
        <input type="text" class="pin-input" id="pin-title-input" placeholder="장소 이름 (예: 물품보관함, 만남의 장소)">
        <textarea class="pin-textarea" id="pin-desc-input" placeholder="장소 설명이나 메모를 남겨주세요."></textarea>
        
        <input type="file" id="pin-file-input" accept="image/*" style="font-size:12px;" onchange="handlePinImageUpload(event)">
        <img id="pin-modal-preview" class="pin-img-preview" alt="장소 사진">

        <div class="pin-btn-group">
          <button class="btn-pin-action btn-pin-save" id="btn-save-pin" onclick="saveCurrentPin()">핑 저장하기</button>
          <button class="btn-pin-action btn-pin-route" id="btn-route-pin" style="display:none;" onclick="startRouteToCurrentPin()">여기로 길안내</button>
          <button class="btn-pin-action btn-pin-delete" id="btn-delete-pin" style="display:none;" onclick="deleteCurrentPin()">삭제</button>
        </div>
      </div>

      <!-- 실내 핑 검색바 -->
      <div class="bottom-search-wrapper" id="indoor-search-wrapper">
        <span class="search-icon">📍</span>
        <input type="text" id="indoor-search-box" class="search-input" placeholder="이 역의 핑 및 시설물 검색..." oninput="onIndoorSearchInput(this.value)">
        <button class="clear-search-btn" id="indoor-clear-search" onclick="clearIndoorSearch()">✕</button>
        <div class="search-suggestions" id="indoor-suggestions"></div>
      </div>
    </div>
  </div>

  <script>
    /* ========================================================
       호선 배지 색상 매핑
    ======================================================== */
    function getLineBadgeClass(lineName) {
      if (lineName.includes("01") || lineName.includes("1호")) return "badge-line-1";
      if (lineName.includes("02") || lineName.includes("2호")) return "badge-line-2";
      if (lineName.includes("03") || lineName.includes("3호")) return "badge-line-3";
      if (lineName.includes("04") || lineName.includes("4호")) return "badge-line-4";
      if (lineName.includes("05") || lineName.includes("5호")) return "badge-line-5";
      if (lineName.includes("06") || lineName.includes("6호")) return "badge-line-6";
      if (lineName.includes("07") || lineName.includes("7호")) return "badge-line-7";
      if (lineName.includes("08") || lineName.includes("8호")) return "badge-line-8";
      if (lineName.includes("09") || lineName.includes("9호")) return "badge-line-9";
      if (lineName.includes("신분당")) return "badge-shin";
      if (lineName.includes("수인분당")) return "badge-suin";
      if (lineName.includes("경의")) return "badge-gyeongui";
      if (lineName.includes("경춘")) return "badge-gyeongchun";
      if (lineName.includes("공항")) return "badge-airport";
      if (lineName.includes("경강")) return "badge-gyeonggang";
      if (lineName.includes("서해")) return "badge-seohae";
      if (lineName.includes("신림")) return "badge-sillim";
      if (lineName.includes("우이")) return "badge-ui";
      if (lineName.includes("의정부")) return "badge-uijeongbu";
      if (lineName.includes("용인") || lineName.includes("에버")) return "badge-ever";
      if (lineName.includes("인천2")) return "badge-incheon2";
      if (lineName.includes("인천")) return "badge-incheon1";
      if (lineName.includes("GTX")) return "badge-gtx";
      if (lineName.includes("김포")) return "badge-gimpo";
      return "badge-default";
    }

    function formatLineName(lineName) {
      return lineName.replace(/^0/, "");
    }

    /* ========================================================
       1. 노선도 및 역 데이터 엔진
    ======================================================== */
    const MAP_SIZE = 2000;
    let STATIONS_LIST = [];
    let currentSelectedStation = null;

    const metroContainer = document.getElementById("metro-container");
    const mapWrapper = document.getElementById("map-wrapper");
    const pinGeneral = document.getElementById("pin-general");
    const stationCard = document.getElementById("station-card");
    const mainSearchBox = document.getElementById("main-search-box");
    const mainClearSearch = document.getElementById("main-clear-search");
    const mainSuggestions = document.getElementById("main-suggestions");

    function cleanStationName(rawName) {
      return rawName.replace(/['"{}\[\]*~`.,:;!?^]/g, "").trim();
    }

    async function initStations() {
      try {
        const response = await fetch("stations.json?v=" + Date.now());
        if (!response.ok) throw new Error("stations.json 로드 실패");
        const rawStations = await response.json();

        STATIONS_LIST = Object.entries(rawStations).map(([key, data]) => {
          const pure = cleanStationName(data.queryTerm || data.name || key).replace(/역$/, "");
          return {
            name: pure + "역",
            queryTerm: pure,
            x: data.x,
            y: data.y,
            lines: data.lines || ["수도권전철"]
          };
        });

        const seoul = STATIONS_LIST.find(s => s.queryTerm === "서울" || s.name === "서울역");
        if (seoul) panToStation(seoul.x, seoul.y, 1.0);
      } catch (err) {
        console.warn("데이터 로드 실패:", err);
      }
    }

    function selectStation(stationObj) {
      currentSelectedStation = stationObj;

      pinGeneral.style.left = `${stationObj.x}px`;
      pinGeneral.style.top = `${stationObj.y}px`;
      pinGeneral.style.display = "block";

      panToStation(stationObj.x, stationObj.y, 1.35);

      document.getElementById("card-station-name").innerText = stationObj.name;
      const badgeContainer = document.getElementById("card-station-badges");
      badgeContainer.innerHTML = "";

      (stationObj.lines || []).forEach(line => {
        const span = document.createElement("span");
        span.className = `badge ${getLineBadgeClass(line)}`;
        span.innerText = formatLineName(line);
        badgeContainer.appendChild(span);
      });

      stationCard.style.display = "block";
      mainSearchBox.value = stationObj.name;
      mainClearSearch.style.display = "block";
      mainSuggestions.style.display = "none";
    }

    function deselectStation() {
      currentSelectedStation = null;
      pinGeneral.style.display = "none";
      stationCard.style.display = "none";
      mainSearchBox.value = "";
      mainClearSearch.style.display = "none";
      mainSuggestions.style.display = "none";
    }

    function onMainSearchInput(query) {
      const q = cleanStationName(query.trim().toLowerCase()).replace(/역$/, "");
      if (!q) {
        mainSuggestions.style.display = "none";
        mainClearSearch.style.display = "none";
        return;
      }

      mainClearSearch.style.display = "block";
      mainSuggestions.innerHTML = "";

      const matched = STATIONS_LIST.filter(st => st.queryTerm.toLowerCase().includes(q) || st.name.toLowerCase().includes(q));

      if (matched.length === 0) {
        mainSuggestions.innerHTML = `<div style="padding:16px; text-align:center; color:#8e95a5; font-size:13px;">일치하는 역이 없습니다.</div>`;
      } else {
        matched.slice(0, 8).forEach(st => {
          const item = document.createElement("div");
          item.className = "suggestion-item";
          const primaryLine = st.lines[0] || "";
          item.innerHTML = `
            <span><strong>${st.name}</strong></span>
            <span class="suggestion-badge ${getLineBadgeClass(primaryLine)}">${formatLineName(primaryLine)}</span>
          `;
          item.onclick = () => selectStation(st);
          mainSuggestions.appendChild(item);
        });
      }
      mainSuggestions.style.display = "block";
    }

    function clearMainSearch() {
      mainSearchBox.value = "";
      mainClearSearch.style.display = "none";
      mainSuggestions.style.display = "none";
      deselectStation();
    }

    /* ========================================================
       스마트 줌 & 패닝 바운더리 락
    ======================================================== */
    function getViewportDimensions() {
      return {
        w: metroContainer.clientWidth || 412,
        h: metroContainer.clientHeight || window.innerHeight
      };
    }
    
    let scale = 1.0;
    let panX = 0;
    let panY = 0;
    const maxScale = 2.4;
    
    function getMinScale() {
      const { w, h } = getViewportDimensions();
      return Math.max(w / MAP_SIZE, h / MAP_SIZE);
    }
    
    function clampPan() {
      const { w, h } = getViewportDimensions();
      const currentMapW = MAP_SIZE * scale;
      const currentMapH = MAP_SIZE * scale;
      panX = Math.min(Math.max(panX, w - currentMapW), 0);
      panY = Math.min(Math.max(panY, h - currentMapH), 0);
    }

    function updateTransform(animate = false) {
      clampPan();
      mapWrapper.style.transition = animate ? "transform 0.45s cubic-bezier(0.19, 1, 0.22, 1)" : "none";
      mapWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }
    
    function zoomManual(delta) {
      const minScale = getMinScale();
      const newScale = Math.min(Math.max(scale + delta, minScale), maxScale);
      const { w, h } = getViewportDimensions();
      panX = (w / 2) - ((w / 2) - panX) * (newScale / scale);
      panY = (h / 2) - ((h / 2) - panY) * (newScale / scale);
      scale = newScale;
      updateTransform(true);
    }
    
    function panToStation(stationX, stationY, targetScale = 1.15) {
      const minScale = getMinScale();
      scale = Math.min(Math.max(targetScale, minScale), maxScale);
      const { w, h } = getViewportDimensions();
      panX = (w / 2) - (stationX * scale);
      panY = (h / 2) - (stationY * scale);
      updateTransform(true);
    }

    let isDragging = false;
    let startX = 0, startY = 0;
    let isMovedDrag = false;
    let downClientX = 0, downClientY = 0;

    metroContainer.addEventListener("mousedown", (e) => {
      if (e.target.closest(".zoom-controls") || e.target.closest(".station-popup-card") || e.target.closest(".bottom-search-wrapper")) return;
      isDragging = true;
      isMovedDrag = false;
      downClientX = e.clientX;
      downClientY = e.clientY;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      if (Math.hypot(e.clientX - downClientX, e.clientY - downClientY) > 5) isMovedDrag = true;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform(false);
    });

    window.addEventListener("mouseup", (e) => {
      if (!isDragging) return;
      isDragging = false;
      if (!isMovedDrag) handleMapClick(e.clientX, e.clientY);
    });

    let touchMoved = false;
    let touchDownX = 0, touchDownY = 0;
    let initialPinchDistance = null;
    let initialScale = 1.0;

    metroContainer.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        touchMoved = false;
        touchDownX = e.touches[0].clientX;
        touchDownY = e.touches[0].clientY;
        startX = e.touches[0].clientX - panX;
        startY = e.touches[0].clientY - panY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        touchMoved = true;
        initialPinchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialScale = scale;
      }
    }, { passive: false });

    metroContainer.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isDragging) {
        if (Math.hypot(e.touches[0].clientX - touchDownX, e.touches[0].clientY - touchDownY) > 6) touchMoved = true;
        panX = e.touches[0].clientX - startX;
        panY = e.touches[0].clientY - startY;
        updateTransform(false);
      } else if (e.touches.length === 2 && initialPinchDistance) {
        touchMoved = true;
        const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const newScale = Math.min(Math.max(initialScale * (currentDistance / initialPinchDistance), getMinScale()), maxScale);
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        panX = midX - (midX - panX) * (newScale / scale);
        panY = midY - (midY - panY) * (newScale / scale);
        scale = newScale;
        updateTransform(false);
      }
    }, { passive: false });

    metroContainer.addEventListener("touchend", (e) => {
      isDragging = false;
      initialPinchDistance = null;
      if (!touchMoved && e.changedTouches.length > 0) handleMapClick(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    });

    function handleMapClick(clientX, clientY) {
      const targetEl = document.elementFromPoint(clientX, clientY);
      if (targetEl && (targetEl.closest(".station-popup-card") || targetEl.closest(".bottom-search-wrapper") || targetEl.closest(".zoom-controls"))) return;

      const rect = metroContainer.getBoundingClientRect();
      const mapX = (clientX - rect.left - panX) / scale;
      const mapY = (clientY - rect.top - panY) / scale;

      let nearestStation = null;
      let minDistance = 45;

      for (const st of STATIONS_LIST) {
        const dist = Math.hypot(st.x - mapX, st.y - mapY);
        if (dist < minDistance) {
          minDistance = dist;
          nearestStation = st;
        }
      }

      if (nearestStation) selectStation(nearestStation);
    }

    /* ========================================================
       2. 실내 지도 화면 전환
    ======================================================== */
    const mainView = document.getElementById("main-view");
    const indoorView = document.getElementById("indoor-view");
    const floorList = document.getElementById("floor-list");

    function enterIndoorView() {
      if (!currentSelectedStation) return;

      document.getElementById("indoor-title-text").innerText = `${currentSelectedStation.name} 실내 지도`;
      floorList.innerHTML = "";

      const floors = currentSelectedStation.name.includes("강남") 
        ? ["B1", "B2", "B3"] 
        : ["2F", "1F", "B1", "B2", "B3"];
      const defaultFloor = "B1";

      floors.forEach(floor => {
        const btn = document.createElement("button");
        btn.className = `floor-btn ${floor === defaultFloor ? 'active' : ''}`;
        btn.innerText = floor;
        btn.onclick = () => selectFloor(floor, btn);
        floorList.appendChild(btn);
      });

      activeFloor = defaultFloor;
      mainView.classList.add("hidden");
      indoorView.classList.remove("hidden");

      renderStationPins();
      closeIndoorNavigation();
    }

    function exitIndoorView() {
      indoorView.classList.add("hidden");
      mainView.classList.remove("hidden");
      closePinModal();
      closeIndoorNavigation();
    }

    function selectFloor(floor, btnEl) {
      activeFloor = floor;
      document.querySelectorAll(".floor-btn").forEach(b => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");
      
      closeIndoorNavigation();
      closePinModal();
      renderStationPins();
      syncPinsTo3D();
    }

    /* ========================================================
       3. 2D ↔ 3D 좌표 변환 및 핑 시스템
    ======================================================== */
    const MAP_2D = { width: 360, height: 520 };
    const MAP_3D = { width: 60, depth: 86.6 };

    function coord2Dto3D(x2d, y2d) {
      const x3d = (x2d / MAP_2D.width - 0.5) * MAP_3D.width;
      const z3d = (y2d / MAP_2D.height - 0.5) * MAP_3D.depth;
      return { x: x3d, y: 1.0, z: z3d };
    }

    function coord3Dto2D(x3d, z3d) {
      const x2d = (x3d / MAP_3D.width + 0.5) * MAP_2D.width;
      const y2d = (z3d / MAP_3D.depth + 0.5) * MAP_2D.height;
      return { x: Math.round(x2d), y: Math.round(y2d) };
    }

    let activeFloor = "B1";

    const STATION_PINS_DB = {
      "강남역": [
        { id: 1, floor: "B1", title: "물품보관함 A구역", desc: "개찰구 바로 우측에 위치", img: "", x: 230, y: 260 },
        { id: 2, floor: "B1", title: "약국 및 수유실", desc: "1번 출구 에스컬레이터 옆", img: "", x: 90, y: 230 },
        { id: 3, floor: "B2", title: "2호선 환승통로 자판기", desc: "계단 내려오자마자 보임", img: "", x: 180, y: 160 }
      ]
    };

    const indoorSvg = document.getElementById("indoor-svg");
    const indoorPinsLayer = document.getElementById("indoor-pins-layer");
    const pinModal = document.getElementById("pin-modal");
    const pinTitleInput = document.getElementById("pin-title-input");
    const pinDescInput = document.getElementById("pin-desc-input");
    const pinPreviewImg = document.getElementById("pin-modal-preview");
    const btnSavePin = document.getElementById("btn-save-pin");
    const btnRoutePin = document.getElementById("btn-route-pin");
    const btnDeletePin = document.getElementById("btn-delete-pin");

    let currentEditingPin = null;
    let tempClickCoord = null;
    let tempUploadedImg = "";

    indoorSvg.addEventListener("click", (e) => {
      const rect = indoorSvg.getBoundingClientRect();
      const clickX = ((e.clientX - rect.left) / rect.width) * 360;
      const clickY = ((e.clientY - rect.top) / rect.height) * 520;
      openCreatePinModal(Math.round(clickX), Math.round(clickY));
    });

    function openCreatePinModal(x, y) {
      currentEditingPin = null;
      tempClickCoord = { x, y };
      tempUploadedImg = "";

      document.getElementById("pin-modal-title").innerText = `📍 [${activeFloor}] 새로운 장소 핑 등록`;
      pinTitleInput.value = "";
      pinDescInput.value = "";
      pinPreviewImg.style.display = "none";
      pinPreviewImg.src = "";
      document.getElementById("pin-file-input").value = "";

      btnSavePin.style.display = "block";
      btnRoutePin.style.display = "none";
      btnDeletePin.style.display = "none";

      pinModal.style.display = "flex";
    }

    function openViewPinModal(pinObj) {
      currentEditingPin = pinObj;

      document.getElementById("pin-modal-title").innerText = `📍 [${pinObj.floor}] ${pinObj.title}`;
      pinTitleInput.value = pinObj.title;
      pinDescInput.value = pinObj.desc || "";

      if (pinObj.img) {
        pinPreviewImg.src = pinObj.img;
        pinPreviewImg.style.display = "block";
      } else {
        pinPreviewImg.style.display = "none";
      }

      btnSavePin.style.display = "none";
      btnRoutePin.style.display = "block";
      btnDeletePin.style.display = "block";

      pinModal.style.display = "flex";
    }

    function closePinModal() {
      pinModal.style.display = "none";
    }

    function handlePinImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        tempUploadedImg = event.target.result;
        pinPreviewImg.src = tempUploadedImg;
        pinPreviewImg.style.display = "block";
      };
      reader.readAsDataURL(file);
    }

    function saveCurrentPin() {
      const title = pinTitleInput.value.trim();
      if (!title) {
        alert("장소 이름을 입력해주세요.");
        return;
      }

      const stName = currentSelectedStation ? currentSelectedStation.name : "강남역";
      if (!STATION_PINS_DB[stName]) STATION_PINS_DB[stName] = [];

      const newPin = {
        id: Date.now(),
        floor: activeFloor,
        title: title,
        desc: pinDescInput.value.trim(),
        img: tempUploadedImg,
        x: tempClickCoord.x,
        y: tempClickCoord.y
      };

      STATION_PINS_DB[stName].push(newPin);
      closePinModal();
      renderStationPins();
      syncPinsTo3D();
      alert(`[${activeFloor}]에 '${title}' 핑이 등록되었습니다!`);
    }

    function deleteCurrentPin() {
      if (!currentEditingPin) return;
      const stName = currentSelectedStation ? currentSelectedStation.name : "강남역";
      STATION_PINS_DB[stName] = STATION_PINS_DB[stName].filter(p => p.id !== currentEditingPin.id);
      closePinModal();
      renderStationPins();
      syncPinsTo3D();
    }

    function renderStationPins() {
      indoorPinsLayer.innerHTML = "";
      const stName = currentSelectedStation ? currentSelectedStation.name : "강남역";
      const pins = (STATION_PINS_DB[stName] || []).filter(p => p.floor === activeFloor);

      pins.forEach(pin => {
        const marker = document.createElement("div");
        marker.className = "indoor-pin-marker";
        marker.style.left = `${(pin.x / 360) * 100}%`;
        marker.style.top = `${(pin.y / 520) * 100}%`;
        marker.innerHTML = `
          <svg width="34" height="44" viewBox="0 0 384 512">
            <path fill="#e84118" stroke="#ffffff" stroke-width="16" d="M172.268 501.67C26.97 291.031 0 269.413 0 192 0 85.961 86.039 0 192 0s192 85.961 192 192c0 77.413-26.97 99.031-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0z"/>
            <circle cx="192" cy="192" r="75" fill="#ffffff"/>
            <text x="192" y="215" font-size="64" font-weight="900" fill="#e84118" text-anchor="middle">${pin.floor}</text>
          </svg>
        `;
        marker.onclick = (e) => {
          e.stopPropagation();
          openViewPinModal(pin);
        };
        indoorPinsLayer.appendChild(marker);
      });
    }

    /* ========================================================
       4. 실내 검색 & 길안내
    ======================================================== */
    const indoorSearchBox = document.getElementById("indoor-search-box");
    const indoorClearSearch = document.getElementById("indoor-clear-search");
    const indoorSuggestions = document.getElementById("indoor-suggestions");

    const DEFAULT_STATION_FACILITIES = [
      { floor: "B1", title: "2호선 탑승게이트", x: 180, y: 75, type: "gate" },
      { floor: "B2", title: "신분당선 탑승게이트", x: 180, y: 445, type: "gate" },
      { floor: "B1", title: "1번 출구", x: 65, y: 260, type: "exit" },
      { floor: "B1", title: "2번 출구", x: 295, y: 260, type: "exit" },
      { floor: "B1", title: "중앙 개찰구", x: 180, y: 260, type: "turnstile" },
      { floor: "B1", title: "화장실", x: 180, y: 350, type: "toilet" }
    ];

    function onIndoorSearchInput(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        indoorSuggestions.style.display = "none";
        indoorClearSearch.style.display = "none";
        return;
      }

      indoorClearSearch.style.display = "block";
      indoorSuggestions.innerHTML = "";

      const stName = currentSelectedStation ? currentSelectedStation.name : "강남역";
      const customPins = STATION_PINS_DB[stName] || [];
      const allTargets = [...DEFAULT_STATION_FACILITIES, ...customPins];

      const matched = allTargets.filter(item => item.title.toLowerCase().includes(q) || (item.desc && item.desc.toLowerCase().includes(q)));

      if (matched.length === 0) {
        indoorSuggestions.innerHTML = `<div style="padding:14px; text-align:center; color:#8e95a5; font-size:13px;">일치하는 핑이나 시설이 없습니다.</div>`;
      } else {
        matched.forEach(target => {
          const item = document.createElement("div");
          item.className = "suggestion-item";
          item.innerHTML = `
            <span>📍 <strong>${target.title}</strong> <span style="font-size:10px; color:#aaa; margin-left:4px;">[${target.floor}]</span></span>
            <span style="font-size:11px; color:#00e5ff;">길안내 ›</span>
          `;
          item.onclick = () => {
            indoorSuggestions.style.display = "none";
            if (target.floor && target.floor !== activeFloor) {
              const targetFloorBtn = Array.from(document.querySelectorAll(".floor-btn")).find(b => b.innerText === target.floor);
              selectFloor(target.floor, targetFloorBtn);
            }
            startRouteToTarget(target);
          };
          indoorSuggestions.appendChild(item);
        });
      }
      indoorSuggestions.style.display = "block";
    }

    function clearIndoorSearch() {
      indoorSearchBox.value = "";
      indoorClearSearch.style.display = "none";
      indoorSuggestions.style.display = "none";
    }

    const indoorNavCard = document.getElementById("indoor-nav-card");
    const indoorPathLine = document.getElementById("indoor-path-line");
    const MY_LOCATION = { x: 65, y: 290, name: "내 위치 (1번 출구 앞)" };

    function openIndoorNavigation() {
      startRouteToTarget({ title: "2호선 탑승게이트", x: 180, y: 75 });
    }

    function closeIndoorNavigation() {
      indoorNavCard.style.display = "none";
      indoorPathLine.style.display = "none";
    }

    function startRouteToCurrentPin() {
      if (!currentEditingPin) return;
      closePinModal();
      startRouteToTarget(currentEditingPin);
    }

    function startRouteToTarget(targetObj) {
      document.getElementById("nav-target-name").innerText = targetObj.title;

      const distPx = Math.hypot(targetObj.x - MY_LOCATION.x, targetObj.y - MY_LOCATION.y);
      const meters = Math.round((distPx / 10) * 3.5);
      const minutes = Math.max(1, Math.round(meters / 60));

      document.getElementById("nav-dist-text").innerText = `약 ${meters}m`;
      document.getElementById("nav-time-text").innerText = `${minutes}분 소요`;

      const cornerX = 180;
      const pathD = `M ${MY_LOCATION.x} ${MY_LOCATION.y} L ${cornerX} ${MY_LOCATION.y} L ${cornerX} ${targetObj.y} L ${targetObj.x} ${targetObj.y}`;
      indoorPathLine.setAttribute("d", pathD);
      indoorPathLine.style.display = "block";

      indoorNavCard.style.display = "flex";
    }

    /* ========================================================
       5. 3D 실내 지도 (Three.js + 강남역_b1 b3.obj 로딩 연동)
    ======================================================== */
    const canvas2D = document.getElementById("indoor-2d-canvas");
    const threeContainer = document.getElementById("three-container");
    const btn2D = document.getElementById("btn-2d");
    const btn3D = document.getElementById("btn-3d");
    const loadingIndicator = document.getElementById("loading-indicator");

    let scene, camera, renderer, controls;
    let isThreeInitialized = false;
    let loadedStationModel = null;
    let pins3DGroup = new THREE.Group();

    function setIndoorMode(mode) {
      if (mode === "2D") {
        btn2D.classList.add("active");
        btn3D.classList.remove("active");
        canvas2D.style.display = "flex";
        threeContainer.style.display = "none";
      } else {
        btn3D.classList.add("active");
        btn2D.classList.remove("active");
        canvas2D.style.display = "none";
        threeContainer.style.display = "block";

        if (!isThreeInitialized) {
          initThreeScene();
          isThreeInitialized = true;
        }

        syncPinsTo3D();
        syncCameraTo2DView();
      }
    }

    function initThreeScene() {
      const width = threeContainer.clientWidth;
      const height = threeContainer.clientHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x181a20);

      const aspect = width / height;
      const d = 48;
      camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 3000);
      camera.position.set(80, 80, 80);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(window.devicePixelRatio);
      threeContainer.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // 조명 설정
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight1.position.set(60, 120, 80);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0x00e5ff, 0.3);
      dirLight2.position.set(-60, 50, -60);
      scene.add(dirLight2);

      scene.add(pins3DGroup);

      // 강남역 OBJ 파일 로드
      loadGangnamObjModel();

      // 3D 뷰포트 클릭 이벤트 (레이캐스팅 연동)
      setup3DRaycasting();

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    // 강남역_b1 b3.obj 파일 비동기 로더 (NaN 버텍스 및 오류 필터링 적용)
    function loadGangnamObjModel() {
      const modelFileName = encodeURI("강남역_b1 b3.obj");
      const objLoader = new THREE.OBJLoader();

      loadingIndicator.style.display = "block";
      loadingIndicator.innerText = "강남역 3D 모델 불러오는 중...";

      objLoader.load(
        modelFileName,
        (obj) => {
          loadingIndicator.style.display = "none";

          const stationMat = new THREE.MeshStandardMaterial({
            color: 0x94a3b8,
            roughness: 0.45,
            metalness: 0.1,
            side: THREE.DoubleSide
          });

          const validMeshes = [];

          // 1. 모델 내 모든 메쉬의 비정상 버텍스(NaN) 정제
          obj.traverse((child) => {
            if (child.isMesh && child.geometry) {
              const geom = child.geometry;
              const pos = geom.attributes.position;

              if (pos && pos.count > 0) {
                let hasNaN = false;
                const arr = pos.array;

                for (let i = 0; i < arr.length; i++) {
                  if (isNaN(arr[i]) || !isFinite(arr[i])) {
                    arr[i] = 0; // 비정상 좌표를 0으로 강제 보정
                    hasNaN = true;
                  }
                }

                if (hasNaN) {
                  pos.needsUpdate = true;
                }

                // 바운딩 볼륨 수동 재계산
                geom.computeVertexNormals();
                geom.computeBoundingBox();
                geom.computeBoundingSphere();

                child.material = stationMat;
                child.castShadow = true;
                child.receiveShadow = true;
                validMeshes.push(child);
              }
            }
          });

          // 유효한 메쉬만 담는 래퍼 그룹 구성
          const cleanGroup = new THREE.Group();
          validMeshes.forEach(m => cleanGroup.add(m));
          loadedStationModel = cleanGroup;

          // 2. 안전한 바운딩 박스 계산 및 크기/원점 자동 정렬
          const box = new THREE.Box3();
          validMeshes.forEach(m => {
            if (m.geometry.boundingBox) {
              box.expandByObject(m);
            }
          });

          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());

          // 중심 및 크기 유효성 검증
          if (!isNaN(center.x) && !isNaN(center.y) && !isNaN(center.z)) {
            cleanGroup.position.x -= center.x;
            cleanGroup.position.y -= center.y;
            cleanGroup.position.z -= center.z;

            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0 && isFinite(maxDim)) {
              const scaleFactor = 75 / maxDim;
              cleanGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);
            }
          } else {
            console.warn("모델 좌표 계산 불가로 기본 스케일(1.0) 적용");
          }

          scene.add(cleanGroup);
          console.log("강남역 3D OBJ 정제 로드 완료");
        },
        (xhr) => {
          if (xhr.lengthComputable) {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            loadingIndicator.innerText = `3D 모델 로딩 중... ${percent}%`;
          }
        },
        (err) => {
          loadingIndicator.style.display = "none";
          console.warn("강남역 OBJ 로드 실패, 대체 기본 맵을 로드합니다:", err);
          loadFallbackBoxModel();
        }
      );
    }

    // 파일 로드 실패 시 대체 기본 메쉬
    function loadFallbackBoxModel() {
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x2e3440, roughness: 0.6 });
      const f1 = new THREE.Mesh(new THREE.BoxGeometry(22, 2, 70), floorMat);
      const f2 = new THREE.Mesh(new THREE.BoxGeometry(60, 2, 22), floorMat);
      const fallbackGroup = new THREE.Group();
      fallbackGroup.add(f1);
      fallbackGroup.add(f2);
      loadedStationModel = fallbackGroup;
      scene.add(fallbackGroup);
    }

    // 2D 핑 데이터를 3D 입체 핀 오브젝트로 동기화
    function syncPinsTo3D() {
      if (!isThreeInitialized) return;

      while (pins3DGroup.children.length > 0) {
        pins3DGroup.remove(pins3DGroup.children[0]);
      }

      const stName = currentSelectedStation ? currentSelectedStation.name : "강남역";
      const pins = (STATION_PINS_DB[stName] || []).filter(p => p.floor === activeFloor);

      pins.forEach(pin => {
        const pos3d = coord2Dto3D(pin.x, pin.y);
        const pinMesh = create3DPinMesh(pin);
        pinMesh.position.set(pos3d.x, 3.0, pos3d.z);
        pins3DGroup.add(pinMesh);
      });
    }

    function create3DPinMesh(pinData) {
      const group = new THREE.Group();

      const headGeo = new THREE.SphereGeometry(1.6, 16, 16);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xe84118, roughness: 0.3 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 4.0;

      const tipGeo = new THREE.ConeGeometry(1.2, 4.0, 16);
      const tipMat = new THREE.MeshStandardMaterial({ color: 0xe84118 });
      const tip = new THREE.Mesh(tipGeo, tipMat);
      tip.rotation.x = Math.PI;
      tip.position.y = 2.0;

      group.add(head);
      group.add(tip);
      group.userData = { pinData: pinData };
      return group;
    }

    function syncCameraTo2DView() {
      if (!controls) return;
      const target3D = coord2Dto3D(180, 260);
      controls.target.set(target3D.x, 0, target3D.z);
      camera.position.set(target3D.x + 50, 70, target3D.z + 50);
      controls.update();
    }

    // 3D 화면 클릭 시 레이캐스터로 핑 선택 및 바닥 클릭 감지
    function setup3DRaycasting() {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      threeContainer.addEventListener("click", (e) => {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        // 1. 기존 3D 핀 클릭 검사
        const pinHits = raycaster.intersectObjects(pins3DGroup.children, true);
        if (pinHits.length > 0) {
          let rootGroup = pinHits[0].object;
          while (rootGroup.parent && rootGroup.parent !== pins3DGroup) {
            rootGroup = rootGroup.parent;
          }
          if (rootGroup.userData && rootGroup.userData.pinData) {
            openViewPinModal(rootGroup.userData.pinData);
            return;
          }
        }

        // 2. 3D 메쉬 표면 클릭 시 새로운 핑 생성
        if (loadedStationModel) {
          const modelHits = raycaster.intersectObject(loadedStationModel, true);
          if (modelHits.length > 0) {
            const hitPt = modelHits[0].point;
            const coord2D = coord3Dto2D(hitPt.x, hitPt.z);
            openCreatePinModal(coord2D.x, coord2D.y);
          }
        }
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      initStations();
    });
  </script>
