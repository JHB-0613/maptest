<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>서울 지하철 공식 노선도 스마트 네비게이션</title>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --bg-dark: #121418;
      --card-bg: rgba(22, 26, 35, 0.94);
      --accent-cyan: #00e5ff;
      --text-main: #ffffff;
      --text-sub: #8e95a5;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      overflow: hidden;
    }

    .phone-container {
      width: 100%;
      max-width: 412px;
      height: 870px;
      background: var(--bg-dark);
      border-radius: 46px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 0 0 4px #2b303c;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      font-size: 14px;
      font-weight: 600;
      z-index: 100;
      pointer-events: none;
    }

    .island {
      width: 110px;
      height: 26px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .view.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }

    /* 1. 메인 노선도 (공식 원본 이미지 1:1 매핑) */
    #main-view {
      background: #f8f9fb;
      overflow: hidden;
      touch-action: none;
    }

    .metro-canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      cursor: grab;
    }

    .metro-canvas-container:active {
      cursor: grabbing;
    }

    /* 정방형 노선도 컨테이너 */
    #map-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 2000px;
      height: 2000px;
      transform-origin: 0 0;
      will-change: transform;
    }

    #official-metro-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }

    /* 역 터치 투명 히트박스 */
    .station-hitbox {
      position: absolute;
      width: 48px;
      height: 48px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      border-radius: 50%;
      z-index: 25;
    }

    /* 역 위에 꽂히는 핀 */
    #station-pin {
      position: absolute;
      width: 42px;
      height: 56px;
      transform: translate(-50%, -100%);
      z-index: 40;
      display: none;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
      animation: pinDrop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    @keyframes pinDrop {
      0% { transform: translate(-50%, -180%); opacity: 0; }
      100% { transform: translate(-50%, -100%); opacity: 1; }
    }

    .zoom-controls {
      position: absolute;
      right: 18px;
      top: 90px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 60;
    }

    .btn-zoom {
      width: 40px;
      height: 40px;
      background: rgba(22, 26, 35, 0.88);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }

    .station-popup-card {
      position: absolute;
      bottom: 96px;
      left: 18px;
      right: 18px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 16px 20px;
      z-index: 50;
      display: none;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(25px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .station-title {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-wrap {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 12px;
      color: white;
    }
    .badge-1 { background-color: #0052a4; }
    .badge-2 { background-color: #3cb44a; }
    .badge-3 { background-color: #ef7c1c; }
    .badge-4 { background-color: #00a5de; }
    .badge-shin { background-color: #d4003b; }

    .btn-close-card {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 14px;
    }

    .btn-detail {
      width: 100%;
      background: linear-gradient(135deg, #1f78ff, #00d2ff);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 6px 18px rgba(0, 180, 255, 0.35);
    }

    /* 2. 실내 지도 화면 */
    #indoor-view {
      background: #181a20;
      display: flex;
      flex-direction: column;
    }

    .indoor-header {
      padding: 50px 20px 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
    }

    .indoor-title-wrap {
      text-align: center;
    }
    .indoor-title {
      font-size: 17px;
      font-weight: 700;
    }
    .indoor-sub {
      font-size: 12px;
      color: var(--text-sub);
    }

    .indoor-controls {
      position: absolute;
      top: 120px;
      left: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 50;
    }

    .toggle-mode {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 3px;
      display: flex;
      width: 90px;
    }

    .toggle-btn {
      flex: 1;
      padding: 6px 0;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: #2a3346;
      color: #00e5ff;
    }

    .floor-selector {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(25, 28, 36, 0.7);
      backdrop-filter: blur(10px);
      padding: 5px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      max-height: 240px;
      overflow-y: auto;
    }

    .floor-btn {
      width: 44px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      color: #a0a8b9;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .floor-btn.active {
      background: rgba(255, 255, 255, 0.2);
      border-color: #ffffff;
      color: #ffffff;
    }

    #indoor-2d-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    #three-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: none;
    }

    /* 3. 하단 공통 검색바 */
    .bottom-search-wrapper {
      position: absolute;
      bottom: 24px;
      left: 18px;
      right: 18px;
      height: 60px;
      background: rgba(22, 26, 35, 0.88);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 0 8px 0 18px;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .search-icon {
      color: var(--text-sub);
      font-size: 18px;
      margin-right: 10px;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .search-input::placeholder {
      color: #636b7c;
    }

    .clear-search-btn {
      color: var(--text-sub);
      font-size: 16px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: none;
      margin-right: 4px;
    }

    .ai-btn {
      border: none;
      background: linear-gradient(135deg, #00c6ff, #9d50bb, #f72585);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      color: white;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(157, 80, 187, 0.6);
    }

    .search-suggestions {
      position: absolute;
      bottom: 74px;
      left: 0;
      right: 0;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      display: none;
      max-height: 240px;
      overflow-y: auto;
    }

    .suggestion-item {
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 14px;
    }

    .suggestion-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="status-bar">
      <span>9:41</span>
      <div class="island"></div>
      <span style="font-size:12px; color:#aaa;">5G ▮ 100%</span>
    </div>

    <!-- 1. 메인 화면 -->
    <div id="main-view" class="view">
      <div class="metro-canvas-container" id="metro-container">
        <div id="map-wrapper">
          <!-- 실제 공식 노선도 이미지 (metroimg.jpg 또는 svg) -->
          <img src="metroimg.jpg" id="official-metro-img" alt="서울 지하철 노선도" onerror="this.src='metroimg.svg'">

          <!-- 역 클릭 히트박스 레이어 -->
          <div class="station-hitbox" id="hitbox-seoul" onclick="onStationClick('seoul')"></div>
          <div class="station-hitbox" id="hitbox-gangnam" onclick="onStationClick('gangnam')"></div>

          <!-- 역 위에 꽂히는 핀 -->
          <svg id="station-pin" viewBox="0 0 384 512">
            <path fill="#00e5ff" d="M172.268 501.67C26.97 291.031 0 269.413 0 192 0 85.961 86.039 0 192 0s192 85.961 192 192c0 77.413-26.97 99.031-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0zM192 272c44.183 0 80-35.817 80-80s-35.817-80-80-80-80 35.817-80 80 35.817 80 80 80z"/>
          </svg>
        </div>
      </div>

      <!-- 수동 줌 버튼 -->
      <div class="zoom-controls">
        <button class="btn-zoom" onclick="zoomManual(0.25)">+</button>
        <button class="btn-zoom" onclick="zoomManual(-0.25)">−</button>
      </div>

      <!-- 역 간략 카드 -->
      <div class="station-popup-card" id="station-card">
        <div class="card-header">
          <div class="station-title">
            <span id="card-station-name">강남역</span>
            <div class="badge-wrap" id="card-station-badges"></div>
          </div>
          <button class="btn-close-card" onclick="deselectStation()">✕</button>
        </div>
        <div class="card-desc" id="card-station-desc">2호선·신분당선 주요 환승 허브</div>
        <button class="btn-detail" onclick="enterIndoorView()">
          <span>실내 지도 자세히 보기</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <!-- 2. 실내 지도 화면 -->
    <div id="indoor-view" class="view hidden">
      <div class="indoor-header">
        <button class="btn-back" onclick="exitIndoorView()">‹</button>
        <div class="indoor-title-wrap">
          <div class="indoor-title" id="indoor-title-text">지하철 실내 지도</div>
          <div class="indoor-sub">(Subway Indoor Map)</div>
        </div>
        <div style="width:38px;"></div>
      </div>

      <div class="indoor-controls">
        <div class="toggle-mode">
          <button class="toggle-btn active" id="btn-2d" onclick="setIndoorMode('2D')">2D</button>
          <button class="toggle-btn" id="btn-3d" onclick="setIndoorMode('3D')">3D</button>
        </div>
        <div class="floor-selector" id="floor-list"></div>
      </div>

      <div id="indoor-2d-canvas">
        <svg width="340" height="420" viewBox="0 0 340 420">
          <g fill="#434955" stroke="#252a34" stroke-width="3">
            <rect x="120" y="40" width="100" height="340" rx="8"/>
            <rect x="40" y="160" width="260" height="100" rx="8"/>
          </g>
          <g fill="#2e3440">
            <rect x="130" y="50" width="80" height="320"/>
            <rect x="50" y="170" width="240" height="80"/>
          </g>
          <g transform="translate(85, 205)"><circle r="12" fill="#ff4757"/><text y="-18" text-anchor="middle" fill="#fff" font-size="11">화장실</text></g>
          <g transform="translate(170, 210)"><circle r="14" fill="#1e90ff"/><text y="-20" text-anchor="middle" fill="#fff" font-size="11">개찰구</text></g>
          <g transform="translate(255, 205)"><circle r="12" fill="#2ed573"/><text y="-18" text-anchor="middle" fill="#fff" font-size="11">1번 출구</text></g>
        </svg>
      </div>

      <div id="three-container"></div>
    </div>

    <!-- 3. 하단 공통 검색바 -->
    <div class="bottom-search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-box" class="search-input" placeholder="역 이름 검색 (예: 강남, 서울역)..." oninput="onSearchInput(this.value)">
      <button class="clear-search-btn" id="clear-search" onclick="clearSearchInput()">✕</button>
      <button class="ai-btn" onclick="triggerAI()">AI</button>
      <div class="search-suggestions" id="suggestions"></div>
    </div>
  </div>

  <script>
    /* ========================================================
       실측 기반 정밀 앵커 좌표계 (2000x2000 기준)
    ======================================================== */
    const MAP_SIZE = 2000;

    const STATIONS = {
      seoul: {
        id: "seoul",
        name: "서울역",
        lines: ["1", "4"],
        desc: "수도권 광역 환승 허브 (지상 2층 ~ 지하 3층)",
        floors: ["2F", "1F", "B1", "B2", "B3"],
        defaultFloor: "B1",
        x: 935,  // 서울역 환승 원형 정중앙
        y: 846
      },
      gangnam: {
        id: "gangnam",
        name: "강남역",
        lines: ["2", "신분당"],
        desc: "2호선·신분당선 복합 환승역 (지하 4층 구조)",
        floors: ["B1", "B2", "B3", "B4"],
        defaultFloor: "B1",
        x: 1380, // 강남역 2호선(초록)-신분당(빨강) 교차 원형 정중앙
        y: 1412
      }
    };

    let currentSelectedStation = null;
    let currentIndoorMode = "2D";
    let activeFloor = "B1";

    const metroContainer = document.getElementById("metro-container");
    const mapWrapper = document.getElementById("map-wrapper");
    const stationPin = document.getElementById("station-pin");
    const stationCard = document.getElementById("station-card");
    const searchBox = document.getElementById("search-box");
    const clearSearchBtn = document.getElementById("clear-search");
    const suggestions = document.getElementById("suggestions");

    // 역 히트박스 위치 세팅
    Object.keys(STATIONS).forEach(id => {
      const el = document.getElementById(`hitbox-${id}`);
      if (el) {
        el.style.left = `${STATIONS[id].x}px`;
        el.style.top = `${STATIONS[id].y}px`;
      }
    });

    /* ========================================================
       스마트 줌 & 패닝 바운더리 락 엔진
    ======================================================== */
    const viewportW = 412;
    const viewportH = 870;

    const minScale = Math.max(viewportW / MAP_SIZE, viewportH / MAP_SIZE);
    const maxScale = 2.4;
    let scale = 1.0;
    let panX = 0;
    let panY = 0;

    let isDragging = false;
    let startX = 0, startY = 0;
    let initialPinchDistance = null;
    let initialScale = 1.0;
    let hasMoved = false;

    function clampPan() {
      const currentMapW = MAP_SIZE * scale;
      const currentMapH = MAP_SIZE * scale;
      const minX = viewportW - currentMapW;
      const minY = viewportH - currentMapH;

      panX = Math.min(Math.max(panX, minX), 0);
      panY = Math.min(Math.max(panY, minY), 0);
    }

    function updateTransform(animate = false) {
      clampPan();
      if (animate) {
        mapWrapper.style.transition = "transform 0.45s cubic-bezier(0.19, 1, 0.22, 1)";
      } else {
        mapWrapper.style.transition = "none";
      }
      mapWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    metroContainer.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = metroContainer.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
      let newScale = scale * zoomFactor;
      newScale = Math.min(Math.max(newScale, minScale), maxScale);

      panX = mouseX - (mouseX - panX) * (newScale / scale);
      panY = mouseY - (mouseY - panY) * (newScale / scale);
      scale = newScale;

      updateTransform(false);
    }, { passive: false });

    metroContainer.addEventListener("mousedown", (e) => {
      if (e.target.closest(".zoom-controls") || e.target.closest(".station-popup-card") || e.target.closest(".bottom-search-wrapper")) return;
      isDragging = true;
      hasMoved = false;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      hasMoved = true;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform(false);
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    metroContainer.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        hasMoved = false;
        startX = e.touches[0].clientX - panX;
        startY = e.touches[0].clientY - panY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialScale = scale;
      }
    }, { passive: false });

    metroContainer.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isDragging) {
        hasMoved = true;
        panX = e.touches[0].clientX - startX;
        panY = e.touches[0].clientY - startY;
        updateTransform(false);
      } else if (e.touches.length === 2 && initialPinchDistance) {
        hasMoved = true;
        const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const newScale = Math.min(Math.max(initialScale * (currentDistance / initialPinchDistance), minScale), maxScale);
        
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        panX = midX - (midX - panX) * (newScale / scale);
        panY = midY - (midY - panY) * (newScale / scale);
        scale = newScale;

        updateTransform(false);
      }
    }, { passive: false });

    metroContainer.addEventListener("touchend", () => {
      isDragging = false;
      initialPinchDistance = null;
    });

    function zoomManual(delta) {
      const newScale = Math.min(Math.max(scale + delta, minScale), maxScale);
      const viewCenterX = viewportW / 2;
      const viewCenterY = viewportH / 2;
      panX = viewCenterX - (viewCenterX - panX) * (newScale / scale);
      panY = viewCenterY - (viewCenterY - panY) * (newScale / scale);
      scale = newScale;
      updateTransform(true);
    }

    function panToStation(stationX, stationY, targetScale = 1.15) {
      scale = Math.min(Math.max(targetScale, minScale), maxScale);
      const viewCenterX = viewportW / 2;
      const viewCenterY = viewportH / 2;
      panX = viewCenterX - (stationX * scale);
      panY = viewCenterY - (stationY * scale);
      updateTransform(true);
    }

    // 초기 화면 진입: 서울역을 화면 정중앙에 배치
    window.addEventListener("DOMContentLoaded", () => {
      panToStation(STATIONS.seoul.x, STATIONS.seoul.y, 1.0);
    });

    function onStationClick(stationId) {
      if (hasMoved) return;
      selectStation(stationId);
    }

    function selectStation(stationId) {
      const station = STATIONS[stationId];
      if (!station) return;

      currentSelectedStation = station;

      stationPin.style.left = `${station.x}px`;
      stationPin.style.top = `${station.y}px`;
      stationPin.style.display = "block";

      panToStation(station.x, station.y, 1.35);

      updatePopupCard(station);
      searchBox.value = station.name;
      clearSearchBtn.style.display = "block";
      suggestions.style.display = "none";
    }

    function deselectStation() {
      currentSelectedStation = null;
      stationPin.style.display = "none";
      stationCard.style.display = "none";
      searchBox.value = "";
      clearSearchBtn.style.display = "none";
      suggestions.style.display = "none";
      panToStation(STATIONS.seoul.x, STATIONS.seoul.y, 1.0);
    }

    function updatePopupCard(station) {
      document.getElementById("card-station-name").innerText = station.name;
      document.getElementById("card-station-desc").innerText = station.desc;
      
      const badgeWrap = document.getElementById("card-station-badges");
      badgeWrap.innerHTML = "";
      station.lines.forEach(line => {
        const span = document.createElement("span");
        let badgeClass = "badge-1";
        if (line === "2") badgeClass = "badge-2";
        else if (line === "4") badgeClass = "badge-4";
        else if (line === "신분당") badgeClass = "badge-shin";

        span.className = `badge ${badgeClass}`;
        span.innerText = line + (line === '신분당' ? "" : "호선");
        badgeWrap.appendChild(span);
      });

      stationCard.style.display = "block";
    }

    function onSearchInput(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        suggestions.style.display = "none";
        clearSearchBtn.style.display = "none";
        return;
      }

      clearSearchBtn.style.display = "block";
      suggestions.innerHTML = "";

      const matched = Object.values(STATIONS).filter(st => {
        return st.name.toLowerCase().includes(q);
      });

      if (matched.length === 0) {
        suggestions.innerHTML = `<div style="padding:16px; text-align:center; color:#8e95a5; font-size:13px;">일치하는 역이 없습니다.</div>`;
      } else {
        matched.forEach(st => {
          const item = document.createElement("div");
          item.className = "suggestion-item";
          item.innerHTML = `
            <span><strong>${st.name}</strong> <span style="font-size:12px; color:#8e95a5;">(${st.lines.join(', ')}호선)</span></span>
            <span style="color:#00e5ff; font-size:12px;">선택 ›</span>
          `;
          item.onclick = () => {
            selectStation(st.id);
          };
          suggestions.appendChild(item);
        });
      }

      suggestions.style.display = "block";
    }

    function clearSearchInput() {
      deselectStation();
    }

    function triggerAI() {
      alert("✨ AI 도우미: 원하는 역이나 환승 경로를 자유롭게 물어보세요.");
    }

    /* 실내 지도 화면 전환 */
    const mainView = document.getElementById("main-view");
    const indoorView = document.getElementById("indoor-view");
    const floorList = document.getElementById("floor-list");

    function enterIndoorView() {
      if (!currentSelectedStation) return;

      document.getElementById("indoor-title-text").innerText = `${currentSelectedStation.name} 실내 지도`;
      floorList.innerHTML = "";
      currentSelectedStation.floors.forEach(floor => {
        const btn = document.createElement("button");
        btn.className = `floor-btn ${floor === currentSelectedStation.defaultFloor ? 'active' : ''}`;
        btn.innerText = floor;
        btn.onclick = () => selectFloor(floor, btn);
        floorList.appendChild(btn);
      });

      activeFloor = currentSelectedStation.defaultFloor;
      mainView.classList.add("hidden");
      indoorView.classList.remove("hidden");
    }

    function exitIndoorView() {
      indoorView.classList.add("hidden");
      mainView.classList.remove("hidden");
    }

    function selectFloor(floor, btnEl) {
      activeFloor = floor;
      document.querySelectorAll(".floor-btn").forEach(b => b.classList.remove("active"));
      btnEl.classList.add("active");
    }

    // Three.js 실내 3D 초기화
    const canvas2D = document.getElementById("indoor-2d-canvas");
    const threeContainer = document.getElementById("three-container");
    const btn2D = document.getElementById("btn-2d");
    const btn3D = document.getElementById("btn-3d");

    let scene, camera, renderer, controls;
    let isThreeInitialized = false;

    function setIndoorMode(mode) {
      currentIndoorMode = mode;
      if (mode === "2D") {
        btn2D.classList.add("active");
        btn3D.classList.remove("active");
        canvas2D.style.display = "flex";
        threeContainer.style.display = "none";
      } else {
        btn3D.classList.add("active");
        btn2D.classList.remove("active");
        canvas2D.style.display = "none";
        threeContainer.style.display = "block";

        if (!isThreeInitialized) {
          initThreeScene();
          isThreeInitialized = true;
        }
      }
    }

    function initThreeScene() {
      const width = threeContainer.clientWidth;
      const height = threeContainer.clientHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x181a20);

      const aspect = width / height;
      const d = 48;
      camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
      camera.position.set(60, 60, 60);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(window.devicePixelRatio);
      threeContainer.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(40, 80, 50);
      scene.add(dirLight);

      const floorMat = new THREE.MeshLambertMaterial({ color: 0x2e3440 });
      const f1 = new THREE.Mesh(new THREE.BoxGeometry(22, 2, 70), floorMat);
      const f2 = new THREE.Mesh(new THREE.BoxGeometry(60, 2, 22), floorMat);
      scene.add(f1);
      scene.add(f2);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }
  </script>
</body>
</html>
