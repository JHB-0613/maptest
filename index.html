<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>서울 지하철 스마트 길찾기 & 실내 네비게이션</title>
  <!-- Three.js CDN (실내 3D 뷰어용) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --bg-dark: #121418;
      --card-bg: rgba(22, 26, 35, 0.94);
      --accent-cyan: #00e5ff;
      --text-main: #ffffff;
      --text-sub: #8e95a5;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      overflow: hidden;
    }

    .phone-container {
      width: 100%;
      max-width: 412px;
      height: 870px;
      background: var(--bg-dark);
      border-radius: 46px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 0 0 4px #2b303c;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      font-size: 14px;
      font-weight: 600;
      z-index: 100;
      pointer-events: none;
    }

    .island {
      width: 110px;
      height: 26px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .view.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }

    /* 1. 메인 노선도 캔버스 */
    #main-view {
      background: #f8f9fb;
      overflow: hidden;
      touch-action: none;
    }

    .metro-canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      cursor: grab;
    }

    .metro-canvas-container:active {
      cursor: grabbing;
    }

    #map-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 2000px;
      height: 2000px;
      transform-origin: 0 0;
      will-change: transform;
    }

    #official-metro-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }

    /* 지도 위 핀 스타일 공통 */
    .map-pin {
      position: absolute;
      transform: translate(-50%, -100%);
      z-index: 45;
      display: none;
      opacity: 1 !important; /* 투명화 방지 강제 적용 */
      pointer-events: none;
      animation: pinDrop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pinDrop {
      0% { transform: translate(-50%, -180%); opacity: 0; }
      100% { transform: translate(-50%, -100%); opacity: 1; }
    }

    .zoom-controls {
      position: absolute;
      right: 18px;
      top: 90px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 60;
    }

    .btn-zoom {
      width: 40px;
      height: 40px;
      background: rgba(22, 26, 35, 0.88);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }

    /* 역 선택 팝업 카드 */
    .station-popup-card {
      position: absolute;
      bottom: 96px;
      left: 18px;
      right: 18px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 16px 20px;
      z-index: 50;
      display: none;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(25px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .station-title-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .station-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
    }

    .badge-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      color: #ffffff;
      line-height: 1.4;
      display: inline-block;
    }

    /* 노선별 공식 색상 */
    .badge-line-1 { background-color: #0052a4; }
    .badge-line-2 { background-color: #00a84d; }
    .badge-line-3 { background-color: #ef7c1c; }
    .badge-line-4 { background-color: #00a5de; }
    .badge-line-5 { background-color: #996cac; }
    .badge-line-6 { background-color: #cd7c2f; }
    .badge-line-7 { background-color: #747f00; }
    .badge-line-8 { background-color: #e6186c; }
    .badge-line-9 { background-color: #bb8336; }
    .badge-shin { background-color: #d4003b; }
    .badge-suin { background-color: #f5a200; }
    .badge-gyeongui { background-color: #77c4a3; }
    .badge-gyeongchun { background-color: #0c8e72; }
    .badge-airport { background-color: #0090d2; }
    .badge-gyeonggang { background-color: #003da5; }
    .badge-seohae { background-color: #81a914; }
    .badge-sillim { background-color: #6789ca; }
    .badge-ui { background-color: #b7c452; }
    .badge-uijeongbu { background-color: #ff9d00; }
    .badge-ever { background-color: #5bb025; }
    .badge-incheon1 { background-color: #7ca8d5; }
    .badge-incheon2 { background-color: #ed8b00; }
    .badge-gtx { background-color: #9a5f78; }
    .badge-gimpo { background-color: #ad8605; }
    .badge-default { background-color: #555e6d; }

    .btn-close-card {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      flex-shrink: 0;
    }

    /* 출발 / 경유 / 도착 액션 버튼 그룹 */
    .route-action-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    .btn-route-action {
      flex: 1;
      padding: 9px 0;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.06);
      color: #d1d5db;
    }

    .btn-route-action:active { transform: scale(0.96); }

    .btn-start:hover, .btn-start:active {
      background: rgba(0, 229, 255, 0.2);
      border-color: #00e5ff;
      color: #00e5ff;
    }
    .btn-via:hover, .btn-via:active {
      background: rgba(186, 104, 200, 0.2);
      border-color: #ba68c8;
      color: #ba68c8;
    }
    .btn-dest:hover, .btn-dest:active {
      background: rgba(46, 213, 115, 0.2);
      border-color: #2ed573;
      color: #2ed573;
    }

    .btn-detail {
      width: 100%;
      background: linear-gradient(135deg, #1f78ff, #00d2ff);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 6px 18px rgba(0, 180, 255, 0.35);
    }

    /* ========================================================
       2. 네이버/카카오 길찾기 스타일 모달 패널
    ======================================================== */
    .route-planning-card {
      position: absolute;
      top: 58px;
      left: 14px;
      right: 14px;
      background: #ffffff;
      color: #1e2430;
      border-radius: 28px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      z-index: 80;
      display: none;
      flex-direction: column;
      overflow: visible;
      animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .route-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px 12px 18px;
    }

    .route-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-route-back {
      border: none;
      background: #f1f3f7;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      color: #333;
    }

    .route-title {
      font-size: 18px;
      font-weight: 800;
    }

    .route-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-pick-map {
      background: #e0f9ff;
      color: #009cb2;
      border: 1px solid #bcecf6;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-pick-map.active {
      background: #00d2d3;
      color: #fff;
    }

    .btn-add-via {
      background: #f1f4f9;
      color: #4b5563;
      border: 1px solid #e0e5ed;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 16px;
      cursor: pointer;
    }

    /* 역 입력 슬롯 영역 */
    .route-slots-wrap {
      display: flex;
      align-items: flex-start;
      padding: 0 16px 14px 16px;
      gap: 10px;
    }

    .route-slots-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    /* 연결 점선 */
    .route-slots-list::before {
      content: "";
      position: absolute;
      left: 17px;
      top: 20px;
      bottom: 20px;
      width: 2px;
      border-left: 2px dashed #c8d0de;
      z-index: 1;
    }

    .route-slot-row {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    .slot-icon-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-left: 11px;
      border: 3px solid #fff;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.15);
    }
    .dot-start { background-color: #00d2d3; }
    .dot-via { background-color: #a55eea; border-radius: 2px; transform: rotate(45deg); }
    .dot-dest { background-color: #26de81; }

    .slot-input-box {
      flex: 1;
      background: #f4f6fa;
      border: 1.5px solid #e2e7f0;
      border-radius: 14px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .slot-input-box:focus-within {
      border-color: #00d2d3;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 210, 211, 0.15);
    }

    .slot-input-field {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      outline: none;
      user-select: text;
    }
    .slot-input-field::placeholder {
      color: #94a3b8;
      font-weight: 500;
    }

    /* 슬롯 인라인 자동완성 드롭다운 */
    .slot-autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      z-index: 120;
      max-height: 180px;
      overflow-y: auto;
      display: none;
    }

    .slot-auto-item {
      padding: 10px 14px;
      font-size: 13px;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
    }
    .slot-auto-item:hover {
      background: #f8fafc;
      color: #009cb2;
    }

    .slot-controls {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .btn-slot-move {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 11px;
      color: #888;
      padding: 2px 4px;
    }

    .btn-slot-del {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 13px;
      color: #9aa2b1;
      padding: 2px 4px;
    }

    .btn-swap-points {
      width: 36px;
      height: 36px;
      background: #f1f4f9;
      border: 1px solid #e0e5ed;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #4b5563;
      flex-shrink: 0;
      margin-top: 5px;
      transition: transform 0.25s ease;
    }
    .btn-swap-points:active { transform: rotate(180deg); }

    /* 하단 조건부 결과 패널 */
    .route-result-section {
      background: #f8fafc;
      border-top: 1px solid #edf2f7;
      padding: 14px 16px 18px 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.3s ease;
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 3개 교통수단 카드 (지하철, 버스, 도보) */
    .transport-tabs-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .trans-card {
      background: #ffffff;
      border: 1px solid #e5e9f0;
      border-radius: 16px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .trans-card.active {
      background: #e0f9ff;
      border-color: #00c6e0;
      box-shadow: 0 4px 12px rgba(0, 198, 224, 0.2);
    }

    .trans-header {
      font-size: 12px;
      font-weight: 700;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 2px;
    }

    .trans-tag {
      background: #111;
      color: #fff;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 4px;
    }

    .trans-time {
      font-size: 18px;
      font-weight: 800;
      color: #111;
    }

    .trans-sub {
      font-size: 10px;
      color: #8892a0;
      margin-top: 2px;
    }

    /* 경로 옵션 */
    .route-options-title {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
    }

    .route-options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .option-btn-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 10px 8px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 82px;
    }

    .option-btn-card.selected {
      background: #e9d5ff;
      border-color: #a855f7;
    }

    .opt-icon-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .opt-icon {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .icon-stairs { background: #e0f2fe; color: #0284c7; }
    .icon-calm { background: #f3e8ff; color: #9333ea; }
    .icon-fast { background: #dcfce7; color: #16a34a; }

    .opt-check {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: white;
    }
    .option-btn-card.selected .opt-check {
      background: #111;
      border-color: #111;
    }

    .opt-title {
      font-size: 12px;
      font-weight: 800;
      color: #1e293b;
      margin-top: 4px;
    }

    .opt-desc {
      font-size: 9.5px;
      color: #64748b;
    }

    /* 3. 실내 지도 화면 */
    #indoor-view {
      background: #181a20;
      display: flex;
      flex-direction: column;
    }

    .indoor-header {
      padding: 50px 20px 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
    }

    .indoor-title-wrap { text-align: center; }
    .indoor-title { font-size: 17px; font-weight: 700; }
    .indoor-sub { font-size: 12px; color: var(--text-sub); }

    .indoor-controls {
      position: absolute;
      top: 120px;
      left: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 50;
    }

    .toggle-mode {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 3px;
      display: flex;
      width: 90px;
    }

    .toggle-btn {
      flex: 1;
      padding: 6px 0;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: #2a3346;
      color: #00e5ff;
    }

    .floor-selector {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(25, 28, 36, 0.7);
      backdrop-filter: blur(10px);
      padding: 5px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      max-height: 240px;
      overflow-y: auto;
    }

    .floor-btn {
      width: 44px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      color: #a0a8b9;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .floor-btn.active {
      background: rgba(255, 255, 255, 0.2);
      border-color: #ffffff;
      color: #ffffff;
    }

    #indoor-2d-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    #three-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: none;
    }

    /* 4. 하단 공통 검색바 */
    .bottom-search-wrapper {
      position: absolute;
      bottom: 24px;
      left: 18px;
      right: 18px;
      height: 60px;
      background: rgba(22, 26, 35, 0.88);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 0 8px 0 18px;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .search-icon {
      color: var(--text-sub);
      font-size: 18px;
      margin-right: 10px;
    }

    .search-input {
      flex: 1;
      background: transparent;

<body>

      <!-- 역 선택 팝업 카드 -->
      <div class="station-popup-card" id="station-card">

            <rect x="40" y="160" width="260" height="100" rx="8"/>

            <rect x="50" y="170" width="240" height="80"/>
          </g>
          <g transform="translate(85, 205)"><circle r="12" fill="#ff4757"/><text y="-18" text-anchor="middle" fill="#fff" font-size="11">화장실</text></g>
          <g transform="translate(170, 210)"><circle r="14" fill="#1e90ff"/><text y="-20" text-anchor="middle" fill="#fff" font-size="11">개찰구</text></g>

    <!-- 3. 하단 공통 검색바 -->
    <div class="bottom-search-wrapper" id="bottom-search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-box" class="search-input" placeholder="길찾기를 도와드릴 까요?" oninput="onSearchInput(this.value)">
      <button class="clear-search-btn" id="clear-search" onclick="event.stopPropagation(); clearSearchInput();">✕</button>
      <button class="ai-btn" onclick="triggerAI()">AI</button>
      <div class="search-suggestions" id="suggestions"></div>
    </div>
  </div>

  <script>
    /* ========================================================
       호선 배지 색상 매핑 유틸리티
    ======================================================== */
    function getLineBadgeClass(lineName) {
      if (lineName.includes("01") || lineName.includes("1호")) return "badge-line-1";
      if (lineName.includes("02") || lineName.includes("2호")) return "badge-line-2";
      if (lineName.includes("03") || lineName.includes("3호")) return "badge-line-3";
      if (lineName.includes("04") || lineName.includes("4호")) return "badge-line-4";
      if (lineName.includes("05") || lineName.includes("5호")) return "badge-line-5";
      if (lineName.includes("06") || lineName.includes("6호")) return "badge-line-6";
      if (lineName.includes("07") || lineName.includes("7호")) return "badge-line-7";
      if (lineName.includes("08") || lineName.includes("8호")) return "badge-line-8";
      if (lineName.includes("09") || lineName.includes("9호")) return "badge-line-9";
      if (lineName.includes("신분당")) return "badge-shin";
      if (lineName.includes("수인분당")) return "badge-suin";
      if (lineName.includes("경의")) return "badge-gyeongui";
      if (lineName.includes("경춘")) return "badge-gyeongchun";
      if (lineName.includes("공항")) return "badge-airport";
      if (lineName.includes("경강")) return "badge-gyeonggang";
      if (lineName.includes("서해")) return "badge-seohae";
      if (lineName.includes("신림")) return "badge-sillim";
      if (lineName.includes("우이")) return "badge-ui";
      if (lineName.includes("의정부")) return "badge-uijeongbu";
      if (lineName.includes("용인") || lineName.includes("에버")) return "badge-ever";
      if (lineName.includes("인천2")) return "badge-incheon2";
      if (lineName.includes("인천")) return "badge-incheon1";
      if (lineName.includes("GTX")) return "badge-gtx";
      if (lineName.includes("김포")) return "badge-gimpo";
      return "badge-default";
    }

    function formatLineName(lineName) {
      return lineName.replace(/^0/, "");
    }

    /* ========================================================
       데이터 로딩 및 정제 (stations.json)
    ======================================================== */
    const MAP_SIZE = 2000;
    let STATIONS_LIST = [];

    let currentSelectedStation = null;
    let currentIndoorMode = "2D";
    let activeFloor = "B1";

    const metroContainer = document.getElementById("metro-container");
    const mapWrapper = document.getElementById("map-wrapper");
    const pinGeneral = document.getElementById("pin-general");
    const pinStart = document.getElementById("pin-start");
    const pinDest = document.getElementById("pin-dest");
    const viaPinsContainer = document.getElementById("via-pins-container");

    const stationCard = document.getElementById("station-card");
    const searchBox = document.getElementById("search-box");
    const clearSearchBtn = document.getElementById("clear-search");
    const suggestions = document.getElementById("suggestions");
    const routePlanningCard = document.getElementById("route-planning-card");
    const routeResultSection = document.getElementById("route-result-section");
    const dynamicViaSlots = document.getElementById("dynamic-via-slots");
    const bottomSearchWrapper = document.getElementById("bottom-search-wrapper");
    const btnPickMap = document.getElementById("btn-pick-map");

    function cleanStationName(rawName) {
      return rawName.replace(/['"{}\[\]*~`.,:;!?^]/g, "").trim();
    }

    async function initStations() {
      try {
        const response = await fetch("stations.json?v=" + Date.now());
        if (!response.ok) throw new Error("stations.json 파일을 찾을 수 없습니다.");
        const rawStations = await response.json();

        STATIONS_LIST = Object.entries(rawStations).map(([key, data]) => {
          const pure = cleanStationName(data.queryTerm || data.name || key).replace(/역$/, "");
          const fullName = pure + "역";

          return {
            name: fullName,
            queryTerm: pure,
            x: data.x,
            y: data.y,
            lines: data.lines || ["수도권전철"],
            isSnapped: data.is_circle_snapped || false
          };
        });

        console.log(`역 데이터 로드 완료: 총 ${STATIONS_LIST.length}개 역`);

        const seoul = STATIONS_LIST.find(s => s.queryTerm === "서울" || s.name === "서울역");
        if (seoul) {
          panToStation(seoul.x, seoul.y, 1.0);
        }
      } catch (err) {
        console.warn("데이터 로드 실패:", err);
      }
    }

    /* ========================================================
       역 개별 선택 및 기본 핀 고정
    ======================================================== */
    function selectStation(stationObj) {
      currentSelectedStation = stationObj;

      pinGeneral.style.left = `${stationObj.x}px`;
      pinGeneral.style.top = `${stationObj.y}px`;
      pinGeneral.style.display = "block";

      panToStation(stationObj.x, stationObj.y, 1.35);

      document.getElementById("card-station-name").innerText = stationObj.name;
      const badgeContainer = document.getElementById("card-station-badges");
      badgeContainer.innerHTML = "";

      const lines = stationObj.lines || [];
      lines.forEach(line => {
        const span = document.createElement("span");
        span.className = `badge ${getLineBadgeClass(line)}`;
        span.innerText = formatLineName(line);
        badgeContainer.appendChild(span);
      });

      stationCard.style.display = "block";
      searchBox.value = stationObj.name;
      clearSearchBtn.style.display = "block";
      suggestions.style.display = "none";
    }

    function deselectStation() {
      currentSelectedStation = null;
      pinGeneral.style.display = "none";
      stationCard.style.display = "none";
      searchBox.value = "";
      clearSearchBtn.style.display = "none";
      suggestions.style.display = "none";
    }

    /* ========================================================
       길찾기 플래너 엔진 (인라인 검색 및 지도 선택 지원)
    ======================================================== */
    let ROUTE_DATA = {
      start: null,
      vias: [], // [{ name, x, y, lines }, ...]
      dest: null
    };

    let selectedOptions = {
      stairs: false,
      calm: true,
      fast: false
    };

    let isMapPickMode = false;
    let activeSlotType = "dest"; // 'start', 'dest', 또는 via index

    function setActiveSlot(slotType) {
      activeSlotType = slotType;
    }

    function toggleMapPickMode() {
      isMapPickMode = !isMapPickMode;
      btnPickMap.classList.toggle("active", isMapPickMode);
      if (isMapPickMode) {
        alert("🗺️ 지도에서 직접 원하는 역 심볼을 터치하면 현재 선택된 슬롯에 입력됩니다.");
      }
    }

    // 슬롯 텍스트 직접 입력 시 자동완성 검색
    function onSlotSearchInput(slotType, query) {
      setActiveSlot(slotType);
      const q = cleanStationName(query.trim().toLowerCase()).replace(/역$/, "");
      const dropdownId = typeof slotType === 'number' ? `dropdown-slot-via-${slotType}` : `dropdown-slot-${slotType}`;
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;

      if (!q) {
        dropdown.style.display = "none";
        return;
      }

      dropdown.innerHTML = "";
      const matched = STATIONS_LIST.filter(st => st.queryTerm.toLowerCase().includes(q) || st.name.toLowerCase().includes(q));

      if (matched.length === 0) {
        dropdown.innerHTML = `<div style="padding:10px 14px; color:#94a3b8; font-size:12px;">일치하는 역이 없습니다.</div>`;
      } else {
        matched.slice(0, 6).forEach(st => {
          const item = document.createElement("div");
          item.className = "slot-auto-item";
          const line = st.lines[0] || "";
          item.innerHTML = `
            <span><strong>${st.name}</strong></span>
            <span class="suggestion-badge ${getLineBadgeClass(line)}">${formatLineName(line)}</span>
          `;
          item.onclick = (e) => {
            e.stopPropagation();
            assignStationToSlot(slotType, st);
            dropdown.style.display = "none";
          };
          dropdown.appendChild(item);
        });
      }
      dropdown.style.display = "block";
    }

    function assignStationToSlot(slotType, stationObj) {
      if (slotType === "start") {
        ROUTE_DATA.start = { ...stationObj };
      } else if (slotType === "dest") {
        ROUTE_DATA.dest = { ...stationObj };
      } else if (typeof slotType === "number") {
        ROUTE_DATA.vias[slotType] = { ...stationObj };
      }

      // 지도 포커스 이동 및 UI 재렌더링
      panToStation(stationObj.x, stationObj.y, 1.25);
      renderRouteUI();
    }

    // 카드에서 [출발], [경유], [도착] 클릭 시
    function assignRouteFromCard(type) {
      if (!currentSelectedStation) return;

      if (type === "start") {
        ROUTE_DATA.start = { ...currentSelectedStation };
        activeSlotType = "dest";
      } else if (type === "dest") {
        ROUTE_DATA.dest = { ...currentSelectedStation };
      } else if (type === "via") {
        const alreadyExists = ROUTE_DATA.vias.some(v => v.name === currentSelectedStation.name);
        if (!alreadyExists) {
          ROUTE_DATA.vias.push({ ...currentSelectedStation });
        }
      }

      stationCard.style.display = "none";
      pinGeneral.style.display = "none";
      openRoutePlanning();
      renderRouteUI();
    }

    function openRoutePlanning() {
      routePlanningCard.style.display = "flex";
      bottomSearchWrapper.style.display = "none";
    }
    
    /* ========================================================
     길찾기 창 닫기 및 모든 경로 핀 완전 제거
    ======================================================== */
    function closeRoutePlanning() {
      routePlanningCard.style.display = "none";
      bottomSearchWrapper.style.display = "flex";

      pinStart.style.display = "none";
      pinDest.style.display = "none";
      pinGeneral.style.display = "none";

      viaPinsContainer.innerHTML = "";
      dynamicViaSlots.innerHTML = "";

      const startInput = document.getElementById("input-slot-start");
      const destInput = document.getElementById("input-slot-dest");
      if (startInput) startInput.value = "";
      if (destInput) destInput.value = "";
      routeResultSection.style.display = "none";

      document.querySelectorAll(".slot-autocomplete-dropdown").forEach(el => el.style.display = "none");

      ROUTE_DATA = {
        start: null,
        vias: [],
        dest: null
      };
    }

    // UI 및 지도 위 핀 갱신
    function renderRouteUI() {
      // 1. 출발역 입력창
      const startInput = document.getElementById("input-slot-start");
      if (ROUTE_DATA.start) {
        startInput.value = ROUTE_DATA.start.name;
        pinStart.style.left = `${ROUTE_DATA.start.x}px`;
        pinStart.style.top = `${ROUTE_DATA.start.y}px`;
        pinStart.style.display = "block";
      } else {
        startInput.value = "";
        pinStart.style.display = "none";
      }

      // 2. 도착역 입력창
      const destInput = document.getElementById("input-slot-dest");
      if (ROUTE_DATA.dest) {
        destInput.value = ROUTE_DATA.dest.name;
        pinDest.style.left = `${ROUTE_DATA.dest.x}px`;
        pinDest.style.top = `${ROUTE_DATA.dest.y}px`;
        pinDest.style.display = "block";
      } else {
        destInput.value = "";
        pinDest.style.display = "none";
      }

      // 3. 경유지 슬롯 및 핀 렌더링
      dynamicViaSlots.innerHTML = "";
      viaPinsContainer.innerHTML = "";

      ROUTE_DATA.vias.forEach((viaObj, idx) => {
        const slotEl = document.createElement("div");
        slotEl.className = "route-slot-row";
        slotEl.innerHTML = `
          <div class="slot-icon-dot dot-via"></div>
          <div class="slot-input-box">
            <input type="text" class="slot-input-field" id="input-slot-via-${idx}" value="${viaObj.name || ''}" 
                   placeholder="경유역 ${idx+1} 검색 또는 입력..."
                   onfocus="setActiveSlot(${idx})" oninput="onSlotSearchInput(${idx}, this.value)">
            <div class="slot-autocomplete-dropdown" id="dropdown-slot-via-${idx}"></div>
            <div class="slot-controls">
              ${idx > 0 ? `<button class="btn-slot-move" onclick="moveVia(${idx}, -1)">▲</button>` : ''}
              ${idx < ROUTE_DATA.vias.length - 1 ? `<button class="btn-slot-move" onclick="moveVia(${idx}, 1)">▼</button>` : ''}
              <button class="btn-slot-del" onclick="removeVia(${idx})">✕</button>
            </div>
          </div>
        `;
        dynamicViaSlots.appendChild(slotEl);

        // 지도 위 보라색 경유 핀
        if (viaObj.x && viaObj.y) {
          const viaPin = document.createElement("div");
          viaPin.className = "map-pin";
          viaPin.style.left = `${viaObj.x}px`;
          viaPin.style.top = `${viaObj.y}px`;
          viaPin.style.display = "block";
          viaPin.style.zIndex = "44";
          viaPin.innerHTML = `
            <svg width="40" height="54" viewBox="0 0 384 512">
              <path fill="#8854d0" stroke="#ffffff" stroke-width="16" d="M172.268 501.67C26.97 291.031 0 269.413 0 192 0 85.961 86.039 0 192 0s192 85.961 192 192c0 77.413-26.97 99.031-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0z"/>
              <circle cx="192" cy="192" r="90" fill="#ffffff"/>
              <text x="192" y="222" font-size="90" font-weight="900" fill="#8854d0" text-anchor="middle" font-family="Pretendard, sans-serif">${idx + 1}</text>
            </svg>
          `;
          viaPinsContainer.appendChild(viaPin);
        }
      });

      // 4. 출발과 도착이 모두 지정되었을 때만 하단 결과창 표시
      if (ROUTE_DATA.start && ROUTE_DATA.dest) {
        routeResultSection.style.display = "flex";
        calculateMockRoute();
      } else {
        routeResultSection.style.display = "none";
      }
    }

    // 경유지 슬롯 추가
    function addViaSlot() {
      ROUTE_DATA.vias.push({ name: "", x: null, y: null, lines: [] });
      activeSlotType = ROUTE_DATA.vias.length - 1;
      renderRouteUI();
      // 새로 추가된 인풋에 즉시 포커스
      setTimeout(() => {
        const newInput = document.getElementById(`input-slot-via-${activeSlotType}`);
        if (newInput) newInput.focus();
      }, 50);
    }

    function moveVia(index, direction) {
      const targetIdx = index + direction;
      if (targetIdx < 0 || targetIdx >= ROUTE_DATA.vias.length) return;
      const temp = ROUTE_DATA.vias[index];
      ROUTE_DATA.vias[index] = ROUTE_DATA.vias[targetIdx];
      ROUTE_DATA.vias[targetIdx] = temp;
      renderRouteUI();
    }

    function removeVia(index) {
      ROUTE_DATA.vias.splice(index, 1);
      renderRouteUI();
    }

    function swapStartAndDest() {
      const temp = ROUTE_DATA.start;
      ROUTE_DATA.start = ROUTE_DATA.dest;
      ROUTE_DATA.dest = temp;
      renderRouteUI();
    }
    /* ========================================================
     교통수단 탭 전환 (지하철 / 버스 / 도보)
    ======================================================== */
    let currentTransportMode = 'subway';
    
    function setTransportMode(mode) {
      currentTransportMode = mode;
    
      // 모든 탭의 active 클래스 제거 후 선택된 탭에만 부여
      document.getElementById("tab-subway").classList.toggle("active", mode === 'subway');
      document.getElementById("tab-bus").classList.toggle("active", mode === 'bus');
      document.getElementById("tab-walk").classList.toggle("active", mode === 'walk');
    }
    // 소요 시간 및 거리 시뮬레이션 계산
    function calculateMockRoute() {
      if (!ROUTE_DATA.start || !ROUTE_DATA.dest) return;
    
      let totalDistPx = 0;
      let prevPt = ROUTE_DATA.start;
    
      for (const via of ROUTE_DATA.vias) {
        if (via.x && via.y) {
          totalDistPx += Math.hypot(via.x - prevPt.x, via.y - prevPt.y);
          prevPt = via;
        }
      }
      totalDistPx += Math.hypot(ROUTE_DATA.dest.x - prevPt.x, ROUTE_DATA.dest.y - prevPt.y);
    
      const km = (totalDistPx / 100 * 1.2).toFixed(1);
      
      let subwayBase = Math.round(km * 2.2 + 8);
      let busBase = Math.round(km * 3.4 + 12);
      let walkBase = Math.round(km * 14);
    
      // 단일 옵션에 따른 가감 시간 계산
      if (currentRouteOption === 'stairs') {
        subwayBase += 4; // 엘리베이터 우회
      } else if (currentRouteOption === 'calm') {
        subwayBase += 6; // 혼잡역 우회
      } else if (currentRouteOption === 'fast') {
        subwayBase -= 2; // 최단 시간 경로
      }
    
      document.getElementById("val-time-subway").innerText = `${subwayBase}분`;
      document.getElementById("val-time-bus").innerText = `${busBase}분`;
      document.getElementById("val-time-walk").innerText = `${walkBase}분`;
      document.getElementById("val-sub-walk").innerText = `${km}km`;
    }

    /* ========================================================
       경로 옵션 단일 선택 (중복 선택 방지)
    ======================================================== */
    // 기본 선택값을 하나만 지정 (예: 'calm' 또는 'fast')
    let currentRouteOption = 'calm'; // 'stairs' | 'calm' | 'fast'
    
    function toggleRouteOption(type) {
      // 이미 선택된 옵션을 다시 눌러도 최소 1개는 유지되도록 단일 선택 적용
      currentRouteOption = type;
    
      // 세 버튼의 선택 UI 클래스 토글 (오직 선택된 하나만 .selected 부여)
      document.getElementById("opt-stairs").classList.toggle("selected", currentRouteOption === 'stairs');
      document.getElementById("opt-calm").classList.toggle("selected", currentRouteOption === 'calm');
      document.getElementById("opt-fast").classList.toggle("selected", currentRouteOption === 'fast');
    
      // 변경된 단일 옵션을 바탕으로 소요 시간 재계산
      calculateMockRoute();
    }

    /* ========================================================
       지도 탭/클릭 시 가장 가까운 역 판별
    ======================================================== */
    function handleMapClick(clientX, clientY) {
      // 길찾기 카드나 상단/하단 UI 요소를 클릭한 경우 지도 클릭 처리 무시
      const targetEl = document.elementFromPoint(clientX, clientY);
      if (targetEl && (targetEl.closest(".route-planning-card") || targetEl.closest(".station-popup-card") || targetEl.closest(".bottom-search-wrapper") || targetEl.closest(".zoom-controls"))) {
        return;
      }
    
      const rect = metroContainer.getBoundingClientRect();
      const screenX = clientX - rect.left;
      const screenY = clientY - rect.top;
    
      const mapX = (screenX - panX) / scale;
      const mapY = (screenY - panY) / scale;
    
      let nearestStation = null;
      let minDistance = 45;
    
      for (const st of STATIONS_LIST) {
        const dist = Math.hypot(st.x - mapX, st.y - mapY);
        if (dist < minDistance) {
          minDistance = dist;
          nearestStation = st;
        }
      }
    
      if (nearestStation) {
        if (routePlanningCard.style.display === "flex" && isMapPickMode) {
          assignStationToSlot(activeSlotType, nearestStation);
          toggleMapPickMode();
        } else {
          selectStation(nearestStation);
        }
      }
    }

    /* ========================================================
       실시간 하단 검색바 필터링
    ======================================================== */
    function onSearchInput(query) {
      const q = cleanStationName(query.trim().toLowerCase()).replace(/역$/, "");
      if (!q) {
        suggestions.style.display = "none";
        clearSearchBtn.style.display = "none";
        return;
      }

      clearSearchBtn.style.display = "block";
      suggestions.innerHTML = "";

      const matched = STATIONS_LIST.filter(st => {
        return st.queryTerm.toLowerCase().includes(q) || st.name.toLowerCase().includes(q);
      });

      if (matched.length === 0) {
        suggestions.innerHTML = `<div style="padding:16px; text-align:center; color:#8e95a5; font-size:13px;">일치하는 역이 없습니다.</div>`;
      } else {
        matched.slice(0, 8).forEach(st => {
          const item = document.createElement("div");
          item.className = "suggestion-item";
          
          const primaryLine = st.lines && st.lines.length > 0 ? st.lines[0] : "";
          const badgeHtml = primaryLine ? `<span class="suggestion-badge ${getLineBadgeClass(primaryLine)}">${formatLineName(primaryLine)}</span>` : "";

          item.innerHTML = `
            <div class="suggestion-left">
              <strong>${st.name}</strong>
              ${badgeHtml}
            </div>
            <span style="color:#00e5ff; font-size:12px;">선택 ›</span>
          `;
          item.onclick = () => {
            selectStation(st);
          };
          suggestions.appendChild(item);
        });
      }

      suggestions.style.display = "block";
    }

    function clearSearchInput() {
      searchBox.value = "";
      clearSearchBtn.style.display = "none";
      suggestions.style.display = "none";
      deselectStation();
    }

    function triggerAI() {
      alert("✨ AI 도우미: 계단이 적은 최적 환승 위치를 실내 지도와 함께 안내해 드립니다.");
    }

    /* ========================================================
       스마트 줌 & 패닝 바운더리 락 엔진 (클릭/드래그 분리)
    ======================================================== */
    const viewportW = 412;
    const viewportH = 870;

    const minScale = Math.max(viewportW / MAP_SIZE, viewportH / MAP_SIZE);
    const maxScale = 2.4;
    let scale = 1.0;
    let panX = 0;
    let panY = 0;

    let isDragging = false;
    let startX = 0, startY = 0;
    let initialPinchDistance = null;
    let initialScale = 1.0;

    let isMovedDrag = false;
    let downClientX = 0, downClientY = 0;

    function clampPan() {
      const currentMapW = MAP_SIZE * scale;
      const currentMapH = MAP_SIZE * scale;
      const minX = viewportW - currentMapW;
      const minY = viewportH - currentMapH;

      panX = Math.min(Math.max(panX, minX), 0);
      panY = Math.min(Math.max(panY, minY), 0);
    }

    function updateTransform(animate = false) {
      clampPan();
      if (animate) {
        mapWrapper.style.transition = "transform 0.45s cubic-bezier(0.19, 1, 0.22, 1)";
      } else {
        mapWrapper.style.transition = "none";
      }
      mapWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    metroContainer.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = metroContainer.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
      let newScale = scale * zoomFactor;
      newScale = Math.min(Math.max(newScale, minScale), maxScale);

      panX = mouseX - (mouseX - panX) * (newScale / scale);
      panY = mouseY - (mouseY - panY) * (newScale / scale);
      scale = newScale;

      updateTransform(false);
    }, { passive: false });

    metroContainer.addEventListener("mousedown", (e) => {
      if (e.target.closest(".zoom-controls") || e.target.closest(".station-popup-card") || e.target.closest(".bottom-search-wrapper") || e.target.closest(".route-planning-card")) return;
      isDragging = true;
      isMovedDrag = false;
      downClientX = e.clientX;
      downClientY = e.clientY;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      if (Math.hypot(e.clientX - downClientX, e.clientY - downClientY) > 5) {
        isMovedDrag = true;
      }
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform(false);
    });

    window.addEventListener("mouseup", (e) => {
      if (!isDragging) return;
      isDragging = false;
      if (!isMovedDrag) {
        handleMapClick(e.clientX, e.clientY);
      }
    });

    let touchMoved = false;
    let touchDownX = 0, touchDownY = 0;

    metroContainer.addEventListener("touchstart", (e) => {
      if (e.target.closest(".route-planning-card")) return;
      if (e.touches.length === 1) {
        isDragging = true;
        touchMoved = false;
        touchDownX = e.touches[0].clientX;
        touchDownY = e.touches[0].clientY;
        startX = e.touches[0].clientX - panX;
        startY = e.touches[0].clientY - panY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        touchMoved = true;
        initialPinchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialScale = scale;
      }
    }, { passive: false });

    metroContainer.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isDragging) {
        if (Math.hypot(e.touches[0].clientX - touchDownX, e.touches[0].clientY - touchDownY) > 6) {
          touchMoved = true;
        }
        panX = e.touches[0].clientX - startX;
        panY = e.touches[0].clientY - startY;
        updateTransform(false);
      } else if (e.touches.length === 2 && initialPinchDistance) {
        touchMoved = true;
        const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const newScale = Math.min(Math.max(initialScale * (currentDistance / initialPinchDistance), minScale), maxScale);

        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        panX = midX - (midX - panX) * (newScale / scale);
        panY = midY - (midY - panY) * (newScale / scale);
        scale = newScale;

        updateTransform(false);
      }
    }, { passive: false });

    metroContainer.addEventListener("touchend", (e) => {
      isDragging = false;
      initialPinchDistance = null;
      if (!touchMoved && e.changedTouches.length > 0) {
        handleMapClick(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      }
    });

    function zoomManual(delta) {
      const newScale = Math.min(Math.max(scale + delta, minScale), maxScale);
      const viewCenterX = viewportW / 2;
      const viewCenterY = viewportH / 2;
      panX = viewCenterX - (viewCenterX - panX) * (newScale / scale);
      panY = viewCenterY - (viewCenterY - panY) * (newScale / scale);
      scale = newScale;
      updateTransform(true);
    }

    function panToStation(stationX, stationY, targetScale = 1.15) {
      scale = Math.min(Math.max(targetScale, minScale), maxScale);
      const viewCenterX = viewportW / 2;
      const viewCenterY = viewportH / 2;
      panX = viewCenterX - (stationX * scale);
      panY = viewCenterY - (stationY * scale);
      updateTransform(true);
    }

    /* ========================================================
       실내 지도 전환 (Three.js 및 층수 선택)
    ======================================================== */
    const mainView = document.getElementById("main-view");
    const indoorView = document.getElementById("indoor-view");
    const floorList = document.getElementById("floor-list");

    function enterIndoorView() {
      if (!currentSelectedStation) return;

      document.getElementById("indoor-title-text").innerText = `${currentSelectedStation.name} 실내 지도`;
      floorList.innerHTML = "";

      const floors = currentSelectedStation.name.includes("강남") 
        ? ["B1", "B2", "B3", "B4"] 
        : ["2F", "1F", "B1", "B2", "B3"];
      const defaultFloor = "B1";

      floors.forEach(floor => {
        const btn = document.createElement("button");
        btn.className = `floor-btn ${floor === defaultFloor ? 'active' : ''}`;
        btn.innerText = floor;
        btn.onclick = () => selectFloor(floor, btn);
        floorList.appendChild(btn);
      });

      activeFloor = defaultFloor;
      mainView.classList.add("hidden");
      indoorView.classList.remove("hidden");
    }

    function exitIndoorView() {
      indoorView.classList.add("hidden");
      mainView.classList.remove("hidden");
    }

    function selectFloor(floor, btnEl) {
      activeFloor = floor;
      document.querySelectorAll(".floor-btn").forEach(b => b.classList.remove("active"));
      btnEl.classList.add("active");
    }

    // Three.js 3D 초기화
    const canvas2D = document.getElementById("indoor-2d-canvas");
    const threeContainer = document.getElementById("three-container");
    const btn2D = document.getElementById("btn-2d");
    const btn3D = document.getElementById("btn-3d");

    let scene, camera, renderer, controls;
    let isThreeInitialized = false;

    function setIndoorMode(mode) {
      currentIndoorMode = mode;
      if (mode === "2D") {
        btn2D.classList.add("active");
        btn3D.classList.remove("active");
        canvas2D.style.display = "flex";
        threeContainer.style.display = "none";
      } else {
        btn3D.classList.add("active");
        btn2D.classList.remove("active");
        canvas2D.style.display = "none";
        threeContainer.style.display = "block";

        if (!isThreeInitialized) {
          initThreeScene();
          isThreeInitialized = true;
        }
      }
    }

    function initThreeScene() {
      const width = threeContainer.clientWidth;
      const height = threeContainer.clientHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x181a20);

      const aspect = width / height;
      const d = 48;
      camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
      camera.position.set(60, 60, 60);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(window.devicePixelRatio);
      threeContainer.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(40, 80, 50);
      scene.add(dirLight);

      const floorMat = new THREE.MeshLambertMaterial({ color: 0x2e3440 });
      const f1 = new THREE.Mesh(new THREE.BoxGeometry(22, 2, 70), floorMat);
      const f2 = new THREE.Mesh(new THREE.BoxGeometry(60, 2, 22), floorMat);
      scene.add(f1);
      scene.add(f2);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    window.addEventListener("DOMContentLoaded", () => {
      initStations();
    });
  </script>
